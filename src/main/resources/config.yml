# ---------------------------------------------------------------------------
#  ArkcronistGenerator
# ---------------------------------------------------------------------------
#  Create a world with:
#     -g ArkcronistGenerator            (uses default-preset below)
#     -g ArkcronistGenerator:BASE
#     -g ArkcronistGenerator:CHAOTIC
#     -g ArkcronistGenerator:INSANE
#
#  Everything under 'terrain:' overrides ALL presets.
#  Everything under 'presets.<name>:' overrides only that preset.
#  Any key you delete simply keeps the preset's own value, so this file is
#  safe to trim down to just the handful of things you want to change.
#
#  Changes apply to chunks generated AFTER a reload; already generated
#  terrain is never rewritten.
# ---------------------------------------------------------------------------

default-preset: BASE

world:
  # Let vanilla place its natural animal/mob groups during generation.
  vanilla-mob-generation: true

performance:
  # Chunks of cached 2D terrain data per world. Roughly 12 KB each.
  terrain-cache-chunks: 512
  # Allow Paper to generate chunks on several threads at once.
  parallel-generation: true

# ---------------------------------------------------------------------------
#  Prefabs (.schem)
# ---------------------------------------------------------------------------
#  Every large tree, every ship and every schematic landmark in the world comes
#  from a Sponge .schem file under:
#
#     plugins/ArkcronistGenerator/prefabs/trees/
#     plugins/ArkcronistGenerator/prefabs/ships/
#     plugins/ArkcronistGenerator/prefabs/ruins/
#
#  Drop a new .schem into one of those folders and restart: there is nothing to
#  register and nothing to recompile.
#
#  THE FOLDER NAME DECIDES WHAT THE STRUCTURE IS - which biomes it appears in,
#  which grid it is placed on, and which procedural structure it replaces:
#
#     houses/         one file = ONE HOUSE; the generator assembles the village
#     villages/       one file = a whole village
#     castles/        replaces the built-in castle
#     cities/         replaces city
#     fortresses/     replaces fortress
#     outposts/       replaces outpost
#     towers/         replaces tower
#     battle_towers/  replaces battle_tower  (torres de combate)
#     temples/        replaces temple
#     camps/          replaces camp
#     mansions/       replaces mansion
#     ruins/          landmarks; replaces nothing, they are added
#     ships/          vessels, with their own rules for deep water and coast
#     trees/          every large tree in the world
#
#  As soon as a folder has files in it, the procedural version of that family
#  stands down, so a world never gets two competing kinds of castle. Families
#  you supply nothing for stay procedural. A folder that is not on the list
#  (say 'statues/') still loads but is never placed on its own.
#
#  The generator does the part the schematic cannot: it lays foundations down to
#  the real ground, cuts back the hillside above the floor it chose, rotates the
#  building, garrisons it, and registers the chests inside it as loot.
#
#  Two things worth knowing about which file gets chosen:
#
#    - The biome filter works on the FAMILY, not on the file. A biome decides
#      whether it allows a temple at all; it does not choose between the desert
#      pyramid and the church. So a desert prefab can turn up in a green biome.
#
#    - The placement test uses the TALLEST and WIDEST file in the folder for the
#      whole family. One very large schematic therefore makes every file in that
#      folder rarer, because they all have to meet its ground requirements.
#
#  It does NOT change what is inside them. A prefab is placed exactly as its
#  author built it - see 'furnish' below if you want that to change.
#
#  The file NAME is the metadata. Words in it become tags, and the generator
#  matches them against what a biome asks for:
#
#     giant_jungle_mangrove_01.schem  -> size 'giant', species jungle/mangrove
#     medium_spruce_birch_02.schem    -> size 'medium', species spruce/birch
#     large_dead_dark_oak_01.schem    -> a bare, leafless dark oak
#
#  Sizes: small, medium, large, giant. Leave the size out and it is worked out
#  from the schematic's own footprint. Size also decides which file a preset
#  reaches for: BASE prefers the medium ones, INSANE the giant ones.
#
#  Species the biomes ask for: oak, big_oak, birch, spruce, giant_spruce,
#  jungle, giant_jungle, acacia, dark_oak, pale_oak, mangrove, cherry, azalea.
#  A species nobody supplied a file for falls back to the closest relative, so
#  a missing cherry tree becomes an azalea or birch rather than bare ground.
#
#  Three families are opt-in and never turn up unless asked for by name:
#     dead     - bare trunks and snags, used by a biome's dead-tree share
#     crystal  - amethyst trees, CHAOTIC and INSANE only
#     autumn   - stained glass canopies, CHAOTIC and INSANE only
#
#  Optional: a file named <prefab>.properties beside a .schem overrides the
#  values guessed from the name:
#     size=giant        weight=2.0        anchor=center|base
#     waterline=11      tags=galleon,pirate
# ---------------------------------------------------------------------------
prefabs:
  # Unpack the schematics bundled in the jar on start-up. Existing files are
  # never overwritten, so this only ever restores something that was deleted.
  # Turn it off once you have curated the folder by hand.
  extract-bundled: true

  # How far to raise a prefab above the ground the placer measured.
  #
  # A schematic's own Y=0 is wherever its author started the selection, which is
  # usually a course or two below the visible floor, so set down on the exact
  # surface height a building reads as sunk into the hill. Raise these if your
  # buildings still look buried, lower them if they hover.
  #
  # Ships are separate because their waterline is guessed from the shape of the
  # hull, and that guess lands low - without the lift a ship floats with its deck
  # awash and only the masts above water.
  lift:
    buildings: 3
    ships: 6

  # The ground under a building is filled in only beneath the columns it actually
  # rests on, and with the biome's own soil and turf rather than stone, so a house
  # on a slope meets the hill instead of standing on a block of masonry. A plot
  # that would need more than a few blocks of fill is not used at all.

  # Add a bed, a lantern and a job block to prefabs that have none, and light the
  # inside of dark buildings.
  #
  # Off by default: what you put in the folder is what gets built, untouched.
  # Worth knowing before you leave it off - a villager needs a BED to claim a
  # house as a home, and without a claimed home there are no trades, no breeding
  # and no iron golems. Most schematics shared online have no bed and no light.
  furnish: false

# ---------------------------------------------------------------------------
#  Colores propios de bioma
# ---------------------------------------------------------------------------
#  El color del cesped y de las hojas lo decide el CLIENTE a partir del bioma en
#  el que cree que estas, y en Minecraft no existe ningun bioma con cesped rojo.
#  Paper tampoco ayuda: su API de registros permite anadir patrones de estandarte,
#  encantamientos y variantes de mobs, pero NO biomas.
#
#  Asi que el plugin escribe un DATAPACK en la carpeta de cada mundo con un bioma
#  propio por cada entrada de aqui. Como un datapack se lee al cargar el mundo,
#  los colores aparecen en el SIGUIENTE arranque, no en el actual.
#
#  Si el datapack no llega a cargar, no pasa nada: el proveedor de biomas pide la
#  clave propia al registro y, si no esta, usa la clave vanilla de siempre. Se
#  pierde el color y nada mas.
#
#  QUE SE TINE Y QUE NO. Esto no es una eleccion del plugin, es como funciona el
#  cliente, y conviene saberlo antes de pelearse con un color:
#
#     SI se tine    grass_block (la capa de encima y los lados), short_grass,
#                   helechos, hierba alta, cana de azucar, lianas, y las hojas
#                   de roble, jungla, acacia, oscuro y mangle.
#     NO se tine    la TIERRA. dirt, coarse_dirt, podzol y rooted_dirt no tienen
#                   tinte de bioma en ningun bioma del juego, ni en vanilla. Un
#                   talud de tierra al descubierto seguira siendo marron.
#                   Tampoco se tinen las hojas de abedul, picea, cerezo ni pale
#                   oak: esas llevan su color pintado en la textura.
#
#  Formato: "#RRGGBB", "0xRRGGBB" o un entero. Cualquier clave que quites
#  simplemente conserva el valor del bioma vanilla en el que se basa.
#
#     grass      cesped y hierba alta
#     foliage    hojas que el juego tine (roble, jungla, acacia, oscuro, mangle)
#     water      agua        water-fog  niebla bajo el agua
#     sky        cielo       fog        niebla
#     rain       si llueve en el bioma (por defecto true)
# ---------------------------------------------------------------------------
biome-colours:
  enabled: true

  # El bosque escarlata.
  #
  # Aqui el color hace TODO el trabajo. El suelo es grass_block sobre dirt y las
  # copas son oak_leaves, exactamente los mismos bloques que en cualquier bosque:
  # no se ha cambiado ni un bloque por otro de color rojo. Lo que los pone rojos
  # es este tinte, y por eso los dos valores que importan son grass y foliage.
  scarlet_forest:
    grass: "#A81F1F"
    foliage: "#B32424"
    sky: "#7A4242"
    fog: "#5C2626"
    water: "#6E2B2B"
    water-fog: "#4A1D1D"

# ---------------------------------------------------------------------------
#  Mobs hostiles propios (MythicMobs + ModelEngine)
# ---------------------------------------------------------------------------
#  Cambia los mobs hostiles VANILLA por mobs de MythicMobs, en los mundos de
#  este generador y solo en los presets que digas aqui.
#
#  QUE HACE FALTA. Los packs de MythicMobs y ModelEngine se instalan aparte,
#  arrastrando sus carpetas a plugins/ como dice la guia del pack. Este plugin
#  NO los trae dentro: solo conoce los nombres y se los pide a MythicMobs.
#
#  SI MYTHICMOBS NO ESTA, no pasa nada: no se sustituye nada y salen los mobs
#  de siempre. El mundo se genera igual y el servidor arranca igual.
#
#  COMO SUSTITUYE. Cuando el juego va a poner un mob de la tabla, se pide antes
#  el mob de MythicMobs; SOLO si ese aparece de verdad se cancela el vanilla.
#  Asi, si escribes mal un nombre o el pack no esta cargado, el mundo se queda
#  con sus mobs en vez de quedarse vacio.
#
#  PESOS. La lista se sortea al azar. Para que uno salga mas, ponlo mas veces.
# ---------------------------------------------------------------------------
hostile-mobs:
  enabled: true

  # En que presets se sustituye. Vacio = en ninguno.
  presets: [INSANE]

  # Por que motivos. NATURAL es el spawn de siempre (de noche, en cuevas).
  # Anade SPAWNER si tambien quieres cambiar los de los generadores de mobs, y
  # REINFORCEMENTS para los refuerzos que llama un zombie al ser golpeado.
  reasons: [NATURAL]

  # Cambiar tambien las guarniciones y jefes de las estructuras del generador.
  replace-structure-mobs: true

  # vanilla -> lista de nombres de MythicMobs.
  #
  # Los nombres de abajo son los de los packs "Goblin Mobs" y "Skeleton Mobs"
  # de Amonde. Si usas otros packs, cambia la lista: aqui solo hay nombres.
  #
  # OJO con skeleton_mage_proj: NO lo pongas. No es un enemigo, es el proyectil
  # que lanza el mago, y es un ARMOR_STAND. En una lista de spawn te llenaria
  # el mundo de armor stands invisibles.
  table:
    ZOMBIE: [am_goblin_melee, am_goblin_melee, am_goblin_whip, am_goblin_brute]
    ZOMBIE_VILLAGER: [am_goblin_mage, am_goblin_ranger]
    HUSK: [am_goblin_brute, am_goblin_melee]
    SKELETON: [skeleton_melee, skeleton_archer, skeleton_archer, skeleton_mage]
    STRAY: [skeleton_archer, skeleton_mage]
    WITHER_SKELETON: [skeleton_elite]

structures:
  fill-loot: true

  # Let the server generate its own vanilla structures in this world: ocean monument,
  # stronghold, ancient city, woodland mansion, mineshaft, desert pyramid, jungle temple,
  # igloo, swamp hut, shipwreck, buried treasure, ruined portal, trail ruins, trial
  # chambers and pillager outposts. They come from the game's own definitions, so they are
  # the real thing, and they follow the vanilla biome keys this generator reports.
  #
  # Note on how the server does this: it places a structure's blocks during its
  # DECORATION pass, not during its structure pass. So turning this on also turns
  # the vanilla decoration pass on - you will see vanilla trees, grass, lakes and
  # ore alongside this generator's own. That is the trade Paper's API makes; there
  # is no way to take the monuments without the flowers. Turn it off if you would
  # rather have only what this generator places.
  vanilla-structures: true

  # While vanilla structures are on, the built-in equivalents stand down automatically so a
  # world does not get two ocean monuments on the same spot. List ids here to force one of
  # them back on, or add ids to 'disabled' to switch any structure off entirely.
  # Built-in ids: village, city, castle, fortress, tower, battle_tower, camp, ruins, bridge,
  #   temple, dungeon, vault, geode, fossil, sky_sanctuary, underwater,
  #   prefab_ship (schematic vessels), prefab_village (aldea de casas .schem),
  #   y un prefab_<carpeta> por cada carpeta de prefabs con regla propia
  force-enabled: []
  disabled: []

minibosses:
  enabled: true
  health-multiplier: 4.0
  damage-multiplier: 2.0
  glowing: true
  # Display names per structure role. Rename freely.
  names:
    tower_captain: "Capitán de la Torre"
    outpost_captain: "Capitán de la Avanzada"
    mansion_master: "Señor de la Mansión"
    witch_matron: "Matrona de la Ciénaga"
    trial_warden: "Guardián de la Prueba"
    battle_champion: "Campeón de la Torre de Combate"
    castle_lord: "Señor del Castillo"
    city_warden: "Guardián de la Ciudad"
    fortress_marshal: "Mariscal de la Fortaleza"
    temple_guardian: "Guardián del Templo"
    dungeon_master: "Amo de la Mazmorra"
    ruin_wraith: "Espectro de las Ruinas"
    deep_leviathan: "Leviatán de las Profundidades"
    sky_sentinel: "Centinela del Cielo"
    camp_chief: "Jefe del Campamento"
    cave_horror: "Horror de las Cavernas"

# ---------------------------------------------------------------------------
#  Biomes and open country
# ---------------------------------------------------------------------------
#  Two knobs under 'terrain:' or 'presets.<name>:' decide how the biome map reads:
#
#    climate-frequency   lower = larger biomes
#    climate-warp        how much biome borders wander; high values shred the map
#    biome-fragmentation breaks a region into patches. Applies to humidity and
#                        weirdness only, never to temperature.
#    thermal-warp-factor share of the warp applied to temperature (default 0.30)
#    thermal-scale       temperature wavelength multiplier (default 0.55)
#
#  Temperature is deliberately kept smoother than everything else. When a cold
#  biome borders a warm one, any snow or ice on the warm side melts on the first
#  random tick and leaves bare patches - so the thermal map is held coherent while
#  humidity and weirdness are free to vary inside it.
#
#  Agua en las cuevas:
#
#  ocean-floor-min   lo mas hondo que puede llegar el fondo marino, en Y. Plataforma, talud,
#                    abismo y fosa restan uno tras otro; esto pone el limite al total. Estaba
#                    llegando a Y=-58, casi la bedrock, y el mar cortaba el techo de la
#                    ancient city. Por defecto -14 (BASE), -19 (CHAOTIC), -24 (INSANE).
#
#  Agua bajo tierra: ya no hay ningun ajuste, porque ya no hay capa freatica. El agua existe
#  donde esta CONECTADA con un cuerpo de agua por encima: el mar, un rio, un lago. El primer
#  bloque solido de una columna sella todo lo que hay debajo, asi que una cueva cerrada es
#  aire y roca. Lo unico que puede haber en una cueva cerrada es lava, junto a la bedrock.
#
#  Tamano de las cuevas. Bajarlas fue lo que dejo de destrozar las ancient city: una sala de
#  40 bloques de alto se traga lo que el servidor construya dentro, porque la estructura se
#  escribe sobre el terreno que el excavador ya dejo.
#
#    cave-cheese-threshold  MAS ALTO = cuevas mas pequenas
#    cavern-density         salas medianas
#
#  Agua:
#
#    water-at-sea-level      true (por defecto) = TODA el agua del mundo a una sola altura, la del
#                            mar. Los lagos solo se llenan si su fondo queda por debajo. Ponlo en
#                            false si quieres lagos con su propio nivel.
#    lake-altitude-fade-end  con water-at-sea-level en false, altura maxima sobre el mar a la que
#                            se permite un lago. Es un corte duro: por encima no se genera ninguno.
#
#  Slopes are generated from a grid sampled every four blocks and interpolated, which leaves them
#  locally straight - and a straight ramp of blocks is a staircase. These add roughness back at
#  block resolution, gated by slope so open country stays buildable:
#
#    surface-detail-amplitude  how much roughness, in blocks (0 disables it)
#    surface-detail-frequency  its wavelength; higher = finer
#    surface-detail-slope-min  gradient below which ground is left perfectly flat
#    surface-detail-slope-max  gradient at which the roughness reaches full strength
#
#    flatland-strength   how much of the world is damped into open, buildable
#    flatland-frequency  country. This is where villages and castles end up.
# ---------------------------------------------------------------------------
#  Terrain overrides applied to every preset.
#  Uncomment only what you want to change.
# ---------------------------------------------------------------------------
terrain:
  # sea-level: 63
  # lava-level: -54

  # --- continents -------------------------------------------------------
  # Lower frequency = bigger landmasses.
  # continent-frequency: 0.00030
  # continent-warp: 320.0
  # ocean-cutoff: -0.04        # continentalness below this is ocean
  # coast-width: 0.075         # width of the shore transition
  # coast-roughness: 0.55      # bays, inlets and peninsulas

  # --- oceans -----------------------------------------------------------
  # shelf-depth: 16.0          # depth at the outer edge of the shelf
  # shelf-extent: 0.20         # share of the ocean occupied by the shelf
  # slope-depth: 52.0          # depth at the foot of the continental slope
  # slope-extent: 0.48
  # abyss-depth: 82.0          # depth of the abyssal plain
  # abyss-roughness: 9.0
  # trench-depth: 38.0         # extra depth inside a trench
  # trench-threshold: 0.86     # lower = more trenches
  # seamount-amplitude: 46.0   # height of underwater mountains
  # ocean-island-strength: 0.35

  # --- land -------------------------------------------------------------
  # base-height: 74.0
  # relief-amplitude: 24.0
  # mountain-amplitude: 115.0
  # mountain-mask-threshold: 0.10   # lower = more mountain range area
  # ridge-sharpness: 0.45
  # plateau-strength: 0.30
  # canyon-strength: 0.18
  # canyon-depth: 34.0
  # cliff-sharpness: 0.25

  # --- erosion ----------------------------------------------------------
  # erosion-passes: 2          # 0-3
  # erosion-talus: 1.35        # higher = steeper slopes survive
  # erosion-strength: 0.42
  # deposition-strength: 0.22

  # --- rivers and lakes -------------------------------------------------
  # rivers: true
  # river-width: 0.030
  # river-depth: 9.0
  # lakes: true
  # lake-chance: 0.10
  # lake-depth: 8.0

  # --- 3D terrain -------------------------------------------------------
  # overhang-strength: 0.08    # ledges and undercut cliffs
  # arch-strength: 0.0         # natural arches and windows
  # floating-island-density: 0.0
  # floating-island-min-y: 150
  # floating-island-max-y: 290

  # --- caves ------------------------------------------------------------
  # caves: true
  # cave-cheese-threshold: 0.62   # lower = more open caves
  # tunnel-threshold: 0.055
  # cavern-density: 0.30
  # surface-cave-clearance: 5     # rock kept under the surface, keeps oceans from draining

  # --- strata and ores --------------------------------------------------
  # strata-thickness: 9.0
  # strata-warp: 12.0
  # ore-multiplier: 1.0

  # --- biomes -----------------------------------------------------------
  # climate-frequency: 0.00062   # higher = smaller biomes
  # climate-warp: 150.0          # higher = borders wander more, and break up
  # biome-fragmentation: 0.0     # humidity and weirdness only, never temperature
  # thermal-warp-factor: 0.30    # keep low: this is what stops snow melting at seams
  # thermal-scale: 0.55          # lower = broader hot and cold belts
  # biome-blend: 32.0            # width of the transition between biomes
  # temperature-bias: 0.0
  # humidity-bias: 0.0

  # --- open country -----------------------------------------------------
  # flatland-strength: 0.35      # how much of the world is damped flat
  # flatland-frequency: 0.00042  # lower = larger plains

  # --- decoration and structures ---------------------------------------
  # tree-density: 1.0
  # decoration-density: 1.0
  # structures: true
  # structure-density: 1.0
  # structure-grid-size: 448     # smaller = structures closer together

# ---------------------------------------------------------------------------
#  Per preset overrides
# ---------------------------------------------------------------------------
presets:
  base:
    # structure-density: 1.0
  chaotic:
    # mountain-amplitude: 178.0
    # canyon-strength: 0.65
  insane:
    # floating-island-density: 0.55
