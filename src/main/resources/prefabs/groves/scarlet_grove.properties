# One grove, placed whole.
#
# The file is a stand of four giant trees on the patch of ground they grew from, 121x53x97. It is
# NOT a bundle of trees to be taken apart: the trees lean on each other, their canopies interlock,
# and the ground under them was cut with them. It goes into the world as one object or not at all.
#
# anchor=center  - the grid position is the middle of the stand, not a corner.
# size=giant     - big enough that the placer treats it as a landmark and spaces it accordingly.
anchor=center
size=giant
weight=1.0
