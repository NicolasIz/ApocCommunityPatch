# ArkEnchants - encantamientos personalizados que leen el formato de AdvancedEnchantments.
# No usa paquetes ni resource pack: los items de ItemsAdder conservan su textura y su lore.

# ArkEnchants trae sus propios encantamientos (enchantments.yml). Si pones esto en true, en el primer
# arranque usa en su lugar los de plugins/AdvancedEnchantments (solo si aqui todavia no hay ninguno).
import-advancedenchantments: false

# Sets de encantamientos incluidos (ademas de enchantments.yml, que son los 55 propios).
# Si pones false, ese set no se carga. Tambien puedes anadir tus propios archivos enchantments-loquesea.yml.
sets:
  extra: true               # enchantments-extra.yml: 360 encantamientos (292 buenos + 68 maldiciones)
  advancedenchantments: true  # enchantments-advanced.yml: los 182 de AdvancedEnchantments
  arcanos: true             # enchantments-arcanos.yml: 3548 encantamientos nuevos (3176 buenos, 93 invocaciones, 279 maldiciones)
  astrales: true            # enchantments-astrales.yml: 52 encantamientos Astrales (solo admins los reparten)

# Nombres y descripciones en espanol, con acentos y en varias lineas (tambien traduce los de AdvancedEnchantments).
# Vienen dentro del plugin (descripciones.yml); si creas plugins/ArkEnchants/descripciones.yml con el mismo
# formato puedes cambiar cualquier texto:   id_del_encanto: {display: 'Nombre', description: 'Texto', applies-to: 'Espadas'}
spanish-texts: true

# Maldiciones: con permanent: true ninguna se quita jugando (ni pergaminos, ni yunque, ni nada).
# Solo un admin puede quitarlas con /ake uncurse <jugador> [maldicion|all].
curses:
  permanent: true

# Libros y objetos Astrales: los mas poderosos. Solo se consiguen de un admin (/ake give).
#   soulbound: no se pueden tirar, ni meter en cofres/shulkers/menus de tradeo, ni marcos, ni bundles.
#   Quedan vinculados al jugador que los recibe: en manos de otro no funcionan y otro no los puede recoger.
#   keep-on-death: no se pierden al morir.
# Quien tenga el permiso arkenchants.astral.bypass (admins) puede moverlos para repartirlos.
astral:
  soulbound: true
  keep-on-death: true
  bound-lore: '&d✦ Vinculado a &f%player%'

# Invocaciones (efecto SUMMON:<criatura>:<segundos>:<cantidad>): criaturas de MythicMobs que luchan por quien las
# llama. Siguen a su dueno, atacan a lo que el golpea o a lo que le ataca, nunca le hacen dano, no sueltan botin
# y desaparecen al acabarse el tiempo. Se prueba el primer mob de MythicMobs que exista; si no hay ninguno,
# sale el de vanilla. Puedes anadir criaturas o cambiar los mobs por los de tus packs.
summons:
  max-per-player: 6      # cuantas invocaciones puede tener un jugador a la vez
  leash: 24              # si se alejan mas de esto, vuelven junto a su dueno
  aggro-radius: 12       # buscan monstruos a esta distancia de su dueno si no hay un enemigo marcado
  creatures:
    esqueleto_guerrero: {name: 'Guerrero Esqueleto', mythicmobs: [ncr_Skeleton_Warrior, DungeonSkeletonsSkeletonSwordSummon], vanilla: SKELETON}
    esqueleto_lancero: {name: 'Lancero Esqueleto', mythicmobs: [ncr_Skeleton_Spearman, DungeonSkeletonsSkeletonSpearSummon], vanilla: SKELETON}
    esqueleto_arquero: {name: 'Arquero Esqueleto', mythicmobs: [ncr_Skeleton_Archer, DungeonSkeletonsSkeletonArcherSummon], vanilla: SKELETON}
    esqueleto_ballestero: {name: 'Ballestero Esqueleto', mythicmobs: [ncr_Skeleton_Crossbow], vanilla: SKELETON}
    esqueleto_mago: {name: 'Mago Esqueleto', mythicmobs: [ncr_Skeleton_Mage], vanilla: SKELETON}
    esqueleto_tanque: {name: 'Coloso Esqueleto', mythicmobs: [ncr_Skeleton_Tank], vanilla: WITHER_SKELETON}
    esqueleto_asesino: {name: 'Asesino Esqueleto', mythicmobs: [ncr_Skeleton_Assassin], vanilla: SKELETON}
    caballero_esqueletico: {name: 'Caballero Esqueletico', mythicmobs: [SkeletalKnight], vanilla: WITHER_SKELETON}
    esbirro_oseo: {name: 'Esbirro Oseo', mythicmobs: [SkeletalMinion], vanilla: SKELETON}
    sabueso_infernal: {name: 'Sabueso Infernal', mythicmobs: [Hellhound], vanilla: WOLF}
    diablillo_igneo: {name: 'Diablillo Igneo', mythicmobs: [Fire_Imp], vanilla: BLAZE}
    diablillo_oscuro: {name: 'Diablillo Oscuro', mythicmobs: [Dark_Imp], vanilla: VEX}
    alma_perdida: {name: 'Alma Perdida', mythicmobs: [Lost_Soul], vanilla: VEX}
    esbirro_blaze: {name: 'Esbirro Blaze', mythicmobs: [Blaze_Minion], vanilla: BLAZE}
    entling_roble: {name: 'Entling de Roble', mythicmobs: [oak_entling], vanilla: WOLF}
    entling_roble_oscuro: {name: 'Entling de Roble Oscuro', mythicmobs: [dark_oak_entling], vanilla: WOLF}
    entling_alamo: {name: 'Entling de Alamo', mythicmobs: [aspen_entling], vanilla: WOLF}
    entling_infernal: {name: 'Entling Infernal', mythicmobs: [hellbark_entling], vanilla: WOLF}
    ent_roble: {name: 'Ent de Roble', mythicmobs: [oak_tree_ent], vanilla: IRON_GOLEM}
    bestia_corteza: {name: 'Bestia de Corteza', mythicmobs: [oak_bark_beast, dark_oak_bark_beast], vanilla: IRON_GOLEM}
