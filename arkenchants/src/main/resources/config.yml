    esbirro_veneno: {name: 'Esbirro de Veneno', mythicmobs: [DE_Esbirro_Veneno], vanilla: CAVE_SPIDER}
    lobo_espectral: {name: 'Lobo Espectral', mythicmobs: [], vanilla: WOLF}
