    draco_terravore: {name: 'Draco Terravore', mythicmobs: [Terravore_Drake], vanilla: RAVAGER}
    wyvern_celeste: {name: 'Wyvern Celeste', mythicmobs: [Skywhisper_Wyvern], vanilla: VEX}
    dragon_flamigero: {name: 'Dragon Flamigero', mythicmobs: [Flarewing_Dragon], vanilla: BLAZE}

# Botin: armas, armaduras y herramientas que salen en cofres de dungeons y estructuras
# (se generan al abrirlos por primera vez) pueden venir encantadas, o malditas.
loot:
  enabled: true
  chance: 40              # % de que un objeto del cofre salga encantado
  max-enchants: 3         # cuantos encantamientos puede traer como mucho
  curse-chance: 20        # % de que ademas traiga una maldicion
  worlds: []              # vacio = todos los mundos
  # Cuanto sale cada rareza (mas alto = mas comun). 0 = nunca sale en cofres.
  group-weights: {SIMPLE: 40, UNIQUE: 25, ELITE: 15, ULTIMATE: 10, LEGENDARY: 6, FABLED: 2}

# Los items encantados con AdvancedEnchantments llevan los encantamientos escritos en el lore
# ("Harvest III"). Si esta activo, al entrar o al coger el item se convierten solos a ArkEnchants.
convert-advancedenchantments-lore: true

# Mundos donde ningun encantamiento se activa.
disabled-worlds: []

# Cada cuantos ticks se aplican los efectos pasivos (EFFECT_STATIC, HELD, REPEATING, ELYTRA_FLY).
passive-interval-ticks: 40

# Ataque cargado: manten clic derecho con el arma hasta que se llene la barra y golpea.
charge:
  seconds: 1.2          # cuanto hay que mantener el clic
  ready-seconds: 4      # cuanto dura la carga esperando el golpe

lore:
  # %group-color% %display% %level% (numero romano) %level-number%
  format: '%group-color%%display% %level%'
  souls: '&cAlmas: &f%souls%'
  protected: '&f&l✦ PROTEGIDO &7(no se pierde al morir)'

apply:
  # Cuantos encantamientos distintos puede tener un item.
  max-enchants: 9
  # Aplicar un libro del mismo nivel que ya tiene el item lo sube un nivel (hasta el maximo).
  upgrade-on-same-level: true

# Lore de los libros. La descripcion se parte sola en lineas de unos "wrap" caracteres.
# Lineas que empiezan por [normal], [curse] o [astral] solo salen en libros de ese tipo.
# %description% %trigger% (cuando se activa) %chance% %cooldown% %level% %max-level% %applies-to%
# %success% %destroy% %group-name% %group-color%
books:
  material: ENCHANTED_BOOK
  name: '%group-color%&l%display% %level%'
  wrap: 34
  lore:
    - '&8%group-name% &8• &7Nivel &f%level% &8de &7%max-level%'
    - ''
    - '&f%description%'
    - ''
    - '&6» &7Se activa: &e%trigger%'
    - '&6» &7Probabilidad: &e%chance% &8| &7Recarga: &e%cooldown%'
    - '&6» &7Aplica a: &e%applies-to%'
    - ''
    - '[normal]&a✔ %success%% &7de exito  &c✖ %destroy%% &7de romper'
    - '[normal]&8Arrastralo encima del item para aplicarlo.'
    - '[curse]&4✖ Maldicion permanente: &cno se quita con nada.'
    - '[curse]&8Solo un administrador puede retirarla.'
    - '[astral]&d✦ Poder astral: &fno se puede tirar ni tradear.'
    - '[astral]&8Queda vinculado a quien lo recibe.'
    - '[astral]&8Arrastralo encima del item para aplicarlo.'

mystery-books:
  material: BOOK
  name: '%group-color%&lLibro %group-name% &7(Clic derecho)'
  lore:
    - '&7Clic derecho para recibir un encantamiento'
    - '%group-color%%group-name% &7al azar.'
    - '&7Exito: &a%success-min%-%success-max%% &8| &7Romper: &c%destroy-min%-%destroy-max%%'

# Pergaminos: se arrastran encima del item, igual que los libros.
#   extract: quita un encantamiento al azar y te lo devuelve como libro (las maldiciones no se pueden extraer).
#   protect: el item no se pierde al morir ni se rompe si falla un libro (la proteccion se gasta al salvarlo).
#   purify:  quita una maldicion al azar (solo si curses.permanent es false; si no, ni se vende).
# success: rango del % de exito con que sale cada pergamino (acepta decimales, p. ej. 0.1-100).
# cost: precio en niveles en /enchanter (0 = no se vende).
scrolls:
  extract:
    material: INK_SAC
    name: '&8&lPergamino de Extraccion &7(%success%%)'
    lore:
      - '&7Arrastralo encima de un item para sacarle'
      - '&7un encantamiento al azar como libro.'
      - '&a%success%% &7de exito'
    success: 25-100
    cost: 30
  protect:
    material: PAPER
    name: '&f&lPergamino de Proteccion'
    lore:
      - '&7Arrastralo encima de un item: no lo perderas'
      - '&7al morir ni se rompera si falla un libro.'
      - '&8Se gasta al salvar el item una vez.'
    success: 100
    cost: 25
  purify:
    material: GLOW_INK_SAC
    name: '&b&lPergamino de Purificacion &7(%success%%)'
    lore:
      - '&7Arrastralo encima de un item para'
      - '&7quitarle una maldicion al azar.'
      - '&a%success%% &7de exito'
    success: 25-100
    cost: 35

soul-tracker:
  material: PAPER
  name: '&f&lRastreador de almas'
  lore:
    - '&7Arrastralo encima de un arma para que'
    - '&7cuente las almas de los jugadores que mates.'

# /ake y /enchanter abren el mismo menu: libros por rareza en el centro, pergaminos a la derecha.
enchanter:
  title: '&5⚡ &dEncantamientos &5⚡'

# Ajustes de libros por grupo. Colores y nombres salen de groups.yml.
# success / destroy: rango del porcentaje que sale al abrir un libro misterioso. Acepta decimales:
# con 0.1-100 un libro puede salir con 0.1% de exito.
# cost: niveles de experiencia en /enchanter.
groups:
  SIMPLE:    {success: 40-100, destroy: 0-30, cost: 5}
  UNIQUE:    {success: 30-100, destroy: 0-35, cost: 10}
  ELITE:     {success: 20-100, destroy: 0-40, cost: 18}
  ULTIMATE:  {success: 10-100, destroy: 5-45, cost: 25}
  LEGENDARY: {success: 1-100, destroy: 5-50, cost: 35}
  FABLED:    {success: 0.1-100, destroy: 10-60, cost: 50}
  CURSE:     {success: 100-100, destroy: 0-0, cost: 0, enchanter: false}
  ASTRAL:    {success: 100-100, destroy: 0-0, cost: 0, enchanter: false}

