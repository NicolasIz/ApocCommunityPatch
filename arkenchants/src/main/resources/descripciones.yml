  description: A veces ganas un gran acelerón al despegar con élitros. Cuesta 10 almas por activación.
  applies-to: Élitros
diploid:
  display: Diploide
  description: A veces multiplica el botín de los monstruos. Cuesta 5 almas por activación.
  applies-to: Espadas
multiplication:
  display: Multiplicación
  description: A veces multiplica lo que sueltan los minerales. Cuesta 5 almas por activación.
  applies-to: Picos
fuddle:
  display: Aturullar
  description: Desordena la barra de objetos de tu oponente.
  applies-to: Espadas
spiritmaster:
  display: Maestro de Espíritus
  description: A veces consigues más almas al matar jugadores.
  applies-to: Espadas
axeofspirits:
  display: Hacha de Espíritus
  description: A veces consigues más almas al matar jugadores.
  applies-to: Hachas
soulminer:
  display: Minero de Almas
  description: A veces consigues almas al minar.
  applies-to: Picos
soulgrind:
  display: Molienda de Almas
  description: A veces consigues almas al matar monstruos.
  applies-to: Espadas
deranged:
  display: Trastornado
  description: Hace caer rayos sobre los jugadores cercanos.
  applies-to: Espadas
magnet:
  display: Imán
  description: Tus golpes atraen a los jugadores hacia ti.
  applies-to: Espadas
callallies:
  display: Llamada a los Aliados
  description: 'Toca el cuerno de cabra: llamas a tus aliados en tu ayuda cuando estás en peligro.'
  applies-to: Cuerno de cabra
sombras_gemelas:
  display: Sombras Gemelas
  description: 'Ataque cargado: invocas clones de sombra con tu aspecto que luchan a tu lado y golpean con parte de tu fuerza.'
  applies-to: Espadas
tajo_del_vacio:
  display: Tajo del Vacío
  description: 'Ataque cargado: te lanzas hacia delante como una sombra, cortando a todo lo que encuentras a tu paso.'
  applies-to: Espadas
torbellino:
  description: 'Ataque cargado: giras sobre ti mismo y golpeas a todos los enemigos que te rodean.'
  applies-to: Espadas
ejecutor:
  description: Haces muchísimo más daño a los enemigos a los que les queda poca vida. Ideal para rematar.
  applies-to: Espadas y hachas
frenesi:
  display: Frenesí
  description: Cada golpe seguido sin que te den suma daño extra. Si te golpean, la cuenta vuelve a empezar.
  applies-to: Espadas
cadena_electrica:
  display: Cadena Eléctrica
  description: Un rayo salta de enemigo en enemigo, dañando a varios a la vez.
  applies-to: Espadas y tridentes
marca_mortal:
  description: Marcas al enemigo con un brillo rojo; mientras dure la marca, recibe mucho más daño de ti.
  applies-to: Espadas
vampiro:
  description: Robas vida con cada golpe y te la quedas tú.
  applies-to: Espadas
sangrado:
  description: 'Hace sangrar al enemigo: pierde vida durante unos segundos y se mueve más lento.'
  applies-to: Espadas y hachas
congelar:
  description: 'Congela al enemigo en el sitio durante un instante: no puede moverse.'
  applies-to: Espadas
cegar:
  description: Lanza ceniza a los ojos del rival y lo deja ciego unos segundos.
  applies-to: Espadas
decapitar:
  description: Probabilidad de que lo que matas suelte su cabeza como trofeo.
  applies-to: Espadas y hachas
sabiduria:
  display: Sabiduría
  description: Los monstruos que matas sueltan más experiencia.
  applies-to: Armas
devorador:
  description: 'Al matar, devoras el alma del caído: te curas y ganas corazones de absorción.'
  applies-to: Espadas y hachas
terremoto:
  description: 'Ataque cargado: golpeas el suelo con tanta fuerza que lanzas a todos por los aires.'
  applies-to: Hachas
hacha_bumeran:
  display: Bumerán
  description: 'Agachado + clic derecho: lanzas el hacha como un bumerán; corta a la ida y a la vuelta y vuelve a tu mano.'
  applies-to: Hachas
berserker:
  description: Cuanta menos vida te queda, más daño haces.
  applies-to: Espadas y hachas
rompehuesos:
  description: Tus golpes aturden al enemigo y le quitan fuerza.
  applies-to: Hachas
lenador:
  display: Leñador
  description: Tala el árbol entero de un golpe (agáchate si solo quieres romper un tronco).
  applies-to: Hachas
flecha_buscadora:
  description: Tus flechas giran en el aire y persiguen al enemigo más cercano.
  applies-to: Arcos y ballestas
abanico:
  description: Disparas varias flechas a la vez en forma de abanico.
  applies-to: Arcos
flecha_explosiva:
  description: Tus flechas explotan al impactar sin romper bloques.
  applies-to: Arcos y ballestas
francotirador:
  description: Los tiros a la cabeza hacen mucho más daño.
  applies-to: Arcos y ballestas
lluvia_de_flechas:
  description: Al acertar, cae una lluvia de flechas del cielo sobre el objetivo.
  applies-to: Arcos
kraken:
  description: El tridente arrastra al enemigo hacia ti entre una nube de tinta.
  applies-to: Tridentes
angel:
  display: Ángel
  description: 'Doble salto: pulsa saltar de nuevo en el aire para impulsarte otra vez.'
  applies-to: Pecheras
espejo:
  description: Devuelve parte del daño que recibes a quien te golpea.
  applies-to: Pecheras
fantasma:
  description: Con poca vida te desvaneces en humo y reapareces lejos del peligro.
  applies-to: Pantalones
escudo_de_almas:
  description: Con poca vida te envuelve un escudo de corazones de absorción.
  applies-to: Pecheras
guardianes:
  description: Al recibir golpes, a veces salen gólems de hierro a defenderte.
  applies-to: Pecheras
adrenalina:
  description: Con poca vida corres y saltas muchísimo más.
  applies-to: Botas
botas_meteoro:
  description: No recibes daño de caídas grandes y al aterrizar abres un cráter que daña a los de alrededor.
  applies-to: Botas
espinas:
  description: Quien te golpea se pincha y recibe daño.
  applies-to: Armadura
endurecer:
  description: A veces reduce el daño que recibes.
  applies-to: Armadura
ultimo_aliento:
