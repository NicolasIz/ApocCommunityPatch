alma_eterna:
  description: 'No pierdes este objeto al morir: vuelve contigo al reaparecer.'
  applies-to: Armas, herramientas y armadura
vidente:
  description: Los monstruos cercanos brillan y los ves a través de las paredes.
  applies-to: Cascos
vision:
