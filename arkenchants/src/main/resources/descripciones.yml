  description: Ves en la oscuridad mientras llevas el casco.
  applies-to: Cascos
branquias:
  description: Respiras bajo el agua mientras llevas el casco.
  applies-to: Cascos
pies_ligeros:
  description: Velocidad permanente mientras llevas las botas.
  applies-to: Botas
saltarin:
