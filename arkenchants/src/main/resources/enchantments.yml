ultimo_aliento:
  display: '%group-color%Ultimo Aliento'
  description: Te salva de la muerte una vez cada 10 minutos.
  applies-to: Pecheras
  type: DEATH
  group: FABLED
  applies: [ALL_CHESTPLATE]
  levels:
    1: {chance: 100, cooldown: 600, effects: ['REVIVE', 'POTION:REGENERATION:1:100', 'MESSAGE:&6&l¡Ultimo Aliento te ha salvado! @Self']}

alma_eterna:
  display: '%group-color%Alma Eterna'
  description: No pierdes este item al morir.
  applies-to: Armas, herramientas y armadura
  type: DEATH
  group: FABLED
  applies: [ALL_SWORD, ALL_AXE, ALL_ARMOR, ALL_PICKAXE, BOW, CROSSBOW, TRIDENT, MACE, ELYTRA]
  levels:
    1: {chance: 100, effects: ['KEEP_ON_DEATH']}

vidente:
  display: '%group-color%Vidente'
  description: Los monstruos cercanos brillan a traves de las paredes.
  applies-to: Cascos
  type: EFFECT_STATIC
  group: ULTIMATE
  applies: [ALL_HELMET]
  levels:
    1: {chance: 100, effects: ['REVEAL:12:3']}
    2: {chance: 100, effects: ['REVEAL:20:3']}

vision:
  display: '%group-color%Vision Nocturna'
  description: Ves en la oscuridad.
  applies-to: Cascos
  type: EFFECT_STATIC
  group: UNIQUE
  applies: [ALL_HELMET]
  levels:
    1: {chance: 100, effects: ['POTION:NIGHT_VISION:0:400']}

branquias:
  display: '%group-color%Branquias'
  description: Respiras bajo el agua.
  applies-to: Cascos
  type: EFFECT_STATIC
  group: SIMPLE
  applies: [ALL_HELMET]
  levels:
    1: {chance: 100, effects: ['POTION:WATER_BREATHING:0:100']}

pies_ligeros:
  display: '%group-color%Pies Ligeros'
  description: Velocidad permanente.
  applies-to: Botas
  type: EFFECT_STATIC
  group: UNIQUE
  applies: [ALL_BOOTS]
  levels:
    1: {chance: 100, effects: ['POTION:SPEED:0:100']}
    2: {chance: 100, effects: ['POTION:SPEED:1:100']}

saltarin:
  display: '%group-color%Saltarin'
  description: Saltas mas alto.
  applies-to: Botas
  type: EFFECT_STATIC
  group: SIMPLE
  applies: [ALL_BOOTS]
  levels:
    1: {chance: 100, effects: ['POTION:JUMP:0:100']}
    2: {chance: 100, effects: ['POTION:JUMP:1:100']}

caminante:
  display: '%group-color%Caminante de Lava'
  description: Caminas sobre la lava (se enfria bajo tus pies).
  applies-to: Botas
  type: EFFECT_STATIC
  group: LEGENDARY
  applies: [ALL_BOOTS]
  levels:
    1: {chance: 100, effects: ['LAVA_WALKER:1', 'POTION:FIRE_RESISTANCE:0:100']}
    2: {chance: 100, effects: ['LAVA_WALKER:2', 'POTION:FIRE_RESISTANCE:0:100']}

pluma:
  display: '%group-color%Pluma'
  description: Menos dano por caidas.
  applies-to: Botas
  type: FALL_DAMAGE
  group: SIMPLE
  applies: [ALL_BOOTS]
  settings: {not-applyable-with: [botas_meteoro]}
  levels:
    1: {chance: 100, effects: ['DECREASE_DAMAGE:40']}
    2: {chance: 100, effects: ['DECREASE_DAMAGE:70']}

ignifugo:
  display: '%group-color%Ignifugo'
  description: Te apaga cuando te quemas.
  applies-to: Pecheras
  type: FIRE
  group: ELITE
  applies: [ALL_CHESTPLATE]
  levels:
    1: {chance: 25, cooldown: 10, effects: ['EXTINGUISH @Self', 'POTION:FIRE_RESISTANCE:0:100']}

# =====================================================================  HERRAMIENTAS
excavadora:
  display: '%group-color%Excavadora'
  description: Rompe en 3x3 (agachado para no hacerlo).
  applies-to: Picos y palas
  type: MINING
  group: LEGENDARY
  applies: [ALL_PICKAXE, ALL_SHOVEL]
  levels:
    1: {chance: 100, conditions: ['%player is sneaking% = true : %stop%'], effects: ['BREAK_BLOCK @Trench{r=3}']}

veta:
  display: '%group-color%Veta'
  description: Agachado, rompe toda la veta de mineral.
  applies-to: Picos
  type: MINING
  group: ULTIMATE
  applies: [ALL_PICKAXE]
  levels:
    1: {chance: 100, conditions: ['%block type% contains ORE : %allow%', '%player is sneaking% = true : %allow%'], effects: ['BREAK_BLOCK @Veinmine{limit=24}']}
    2: {chance: 100, conditions: ['%block type% contains ORE : %allow%', '%player is sneaking% = true : %allow%'], effects: ['BREAK_BLOCK @Veinmine{limit=64}']}

fundicion:
  display: '%group-color%Fundicion'
  description: Los minerales salen fundidos.
  applies-to: Picos
  type: MINING
  group: ELITE
  applies: [ALL_PICKAXE]
  levels:
    1: {chance: 100, conditions: ['%block type% contains ORE : %allow%'], effects: ['SMELT', 'PARTICLE:FLAME:8:0.02 @Block']}

riqueza:
  display: '%group-color%Riqueza'
  description: Probabilidad de mas botin al minar.
  applies-to: Picos
  type: MINING
  group: ULTIMATE
  applies: [ALL_PICKAXE]
  levels:
    1: {chance: 10, conditions: ['%block type% contains ORE : %allow%'], effects: ['MORE_DROPS:1']}
    2: {chance: 15, conditions: ['%block type% contains ORE : %allow%'], effects: ['MORE_DROPS:1']}
    3: {chance: 20, conditions: ['%block type% contains ORE : %allow%'], effects: ['MORE_DROPS:2']}

tesoro:
  display: '%group-color%Cazatesoros'
  description: A veces encuentras gemas escondidas en la piedra.
  applies-to: Picos
  type: MINING
  group: LEGENDARY
  applies: [ALL_PICKAXE]
  levels:
    1: {chance: 0.4, conditions: ['%block natural% = false : %stop%', '%block type% contains STONE : %allow%'], effects: ['DROP_ITEM:<random word>DIAMOND,EMERALD,GOLD_INGOT,LAPIS_LAZULI</random word>:1 @Block', 'PLAY_SOUND:ENTITY_PLAYER_LEVELUP @Self']}
    2: {chance: 0.8, conditions: ['%block natural% = false : %stop%', '%block type% contains STONE : %allow%'], effects: ['DROP_ITEM:<random word>DIAMOND,EMERALD,GOLD_INGOT,LAPIS_LAZULI</random word>:1 @Block', 'PLAY_SOUND:ENTITY_PLAYER_LEVELUP @Self']}

telequinesis:
  display: '%group-color%Telequinesis'
  description: Lo que rompes va directo al inventario.
  applies-to: Herramientas
  type: MINING
  group: UNIQUE
  applies: [ALL_TOOLS]
  levels:
    1: {chance: 100, effects: ['TP_DROPS']}

cosecha:
  display: '%group-color%Cosecha'
  description: Replanta los cultivos que recoges.
  applies-to: Azadas
  type: MINING
  group: UNIQUE
  applies: [ALL_HOE]
  levels:
    1: {chance: 100, conditions: ['%is fully grown% = false : %stop%'], effects: ['PLANT_SEEDS:0']}
    2: {chance: 100, conditions: ['%is fully grown% = false : %stop%'], effects: ['BREAK_BLOCK @Trench{r=3}', 'PLANT_SEEDS:1']}

autorreparacion:
  display: '%group-color%Autorreparacion'
  description: El item se repara solo poco a poco.
  applies-to: Armas, herramientas y armadura
  type: REPEATING
  group: LEGENDARY
  applies: [ALL_SWORD, ALL_AXE, ALL_PICKAXE, ALL_SHOVEL, ALL_HOE, ALL_ARMOR, BOW, CROSSBOW, TRIDENT, MACE]
  levels:
    1: {chance: 100, effects: ['ADD_DURABILITY_ITEM:1']}
    2: {chance: 100, effects: ['ADD_DURABILITY_ITEM:2']}

# =====================================================================  PESCA Y ELITROS
anzuelo_rapido:
  display: '%group-color%Anzuelo Rapido'
  description: Recoges el pez solo en cuanto pica.
  applies-to: Canas de pescar
  type: BITE_HOOK
  group: UNIQUE
  applies: [FISHING_ROD]
  levels:
    1: {chance: 50, effects: ['AUTO_REEL']}
    2: {chance: 100, effects: ['AUTO_REEL']}

pesca_doble:
  display: '%group-color%Pesca Doble'
  description: Probabilidad de sacar el doble.
  applies-to: Canas de pescar
  type: CATCH_FISH
  group: ELITE
  applies: [FISHING_ROD]
  levels:
    1: {chance: 15, effects: ['DOUBLE_CATCH:2']}
    2: {chance: 25, effects: ['DOUBLE_CATCH:2']}
    3: {chance: 35, effects: ['DOUBLE_CATCH:3']}

propulsor:
  display: '%group-color%Propulsor'
  description: 'Volando con elitros, agachate para un impulso.'
  applies-to: Elitros
  type: ELYTRA_FLY
  group: LEGENDARY
  applies: [ELYTRA]
  levels:
    1: {chance: 100, cooldown: 4, conditions: ['%player is sneaking% = true : %allow%'], effects: ['BOOST:FORWARD:25', 'PARTICLE:FIREWORK:20:0.1 @Self', 'PLAY_SOUND:ENTITY_FIREWORK_ROCKET_LAUNCH @Self']}
    2: {chance: 100, cooldown: 3, conditions: ['%player is sneaking% = true : %allow%'], effects: ['BOOST:FORWARD:32', 'PARTICLE:FIREWORK:25:0.1 @Self', 'PLAY_SOUND:ENTITY_FIREWORK_ROCKET_LAUNCH @Self']}
