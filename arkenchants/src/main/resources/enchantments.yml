# Encantamientos de ArkEnchants (formato compatible con AdvancedEnchantments).
#
# nombre:
#   display: '%group-color%Nombre'       como sale en el lore
#   description / applies-to             texto para libros y /arkenchants info
#   type: ATTACK;ATTACK_MOB              cuando se activa
#   group: ELITE                         rareza (groups.yml)
#   applies: [ALL_SWORD]                 ALL_SWORD, ALL_AXE, ALL_ARMOR, ALL_HELMET, ALL_BOOTS, BOW, TRIDENT...
#   settings: {not-applyable-with: [otro], required-enchants: ['otro:2']}
#   levels:
#     1: {chance: 10, cooldown: 5, conditions: [...], effects: [...]}
#
# Tipos: ATTACK, ATTACK_MOB, CHARGED_ATTACK (manten clic derecho hasta cargar y golpea), DEFENSE,
#   DEFENSE_MOB, DEFENSE_PROJECTILE, SHOOT, SHOOT_MOB, BOW_FIRE (al soltar la flecha), MINING, KILL_MOB,
#   KILL_PLAYER, DEATH, FALL_DAMAGE, FIRE, EXPLOSION, EFFECT_STATIC, HELD, REPEATING, ELYTRA_FLY,
#   RIGHT_CLICK, CATCH_FISH, HOOK_ENTITY, BITE_HOOK, ITEM_BREAK
# Objetivos: @Victim @Attacker @Self @Aoe{radius=3,target=mobs|players|all} @Block @Trench{r=3}
#   @Tunnel{radiuscustom=1x3x5,mode=STRAIGHT|UP|DOWN} @Veinmine{limit=64}
# Efectos propios de ArkEnchants:
#   CLONES:cantidad:segundos:%dano       clones sombra tuyos que atacan al objetivo
#   DASH:distancia:dano                  embestida que atraviesa y corta a todo lo que toca
#   SLAM:radio:dano:elevacion            golpe al suelo que lanza por los aires
#   CHAIN_LIGHTNING:saltos:dano          rayo que salta de enemigo en enemigo
#   MARK:segundos                        marca (brilla); %victim is marked% = true
#   THROW_WEAPON:dano:distancia          lanza el arma como bumeran y vuelve
#   HOMING:fuerza  MULTISHOT:flechas:angulo    (en BOW_FIRE)
#   REFLECT:%  BLINK:distancia  DOUBLE_JUMP:potencia  REVEAL:radio:segundos
#   DROP_ITEM:MATERIAL:cantidad  DOUBLE_CATCH:multiplicador  ACTIONBAR:texto

