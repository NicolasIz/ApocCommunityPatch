  frostpine_log:
    type: custom_block
    display-name: "<#9fd0d6>Frostpine Log"
    resource:
      parent: block/cube_column
      textures:
        side: block/frostpine_log
        end: block/frostpine_log_top
    block:
      axis: true                 # lies along the face it is placed against, as logs do
      tool: axe
      hardness: 2
      skill-xp: 2

  frostpine_planks:
    type: custom_block
    display-name: "<#9fd0d6>Frostpine Planks"
    resource:
      texture: block/frostpine_planks
    block:
      tool: axe
      hardness: 2

  frostpine_leaves:
    type: custom_block
    display-name: "<#9fd0d6>Frostpine Leaves"
    resource:
      texture: block/frostpine_leaves
    block:
      shape: leaves             # see-through, mined fast with shears or a hoe
      drops:                    # without shears or silk touch
        - {item: woodland:frostpine_sapling, chance: 0.05}
        - {item: STICK, amount: 1-2, chance: 0.02}

recipes:

  frostpine_planks:
    type: shapeless
    ingredients: [woodland:frostpine_log]
    result: woodland:frostpine_planks 4
    group: woodland_planks
    category: building
