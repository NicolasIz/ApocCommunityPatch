# ---------------------------------------------------------------------------
#  Frostpine (5.5) - Tiers of blue needles that never lose their frost.
# ---------------------------------------------------------------------------
#  A sapling planted on its soil grows, in two stages, into a tree drawn
#  block by block below in its blueprints: one picked at random, turned and
#  mirrored, coming up over a few seconds. Bone meal hurries it along.
#  Its leaves are its own: they fall when the tree is cut down, dropping a
#  sapling now and then; shears or silk touch take them whole.
#
#     /customgive <player> woodland:frostpine_sapling
# ---------------------------------------------------------------------------

namespace: woodland

items:

  frostpine_sapling:
    type: custom_crop
    display-name: "<#9fd0d6>Frostpine Sapling"
    lore:
      - "<gray>Tiers of blue needles that never lose their frost."
      - "<dark_gray>Plant on grass or dirt."
    resource:
      texture: crop/frostpine_sapling_1
    crop:
      stages:
        - crop/frostpine_sapling_0
        - crop/frostpine_sapling_1
      stage-seconds: 300
      min-light: 9
      bone-meal: true
      tree:
        log: frostpine_log
        leaves: frostpine_leaves
        growth-seconds: 3.5
        generation:
          biomes: [minecraft:snowy_taiga, minecraft:grove, minecraft:snowy_plains]
          per-chunk: 1
          chance: 0.3
