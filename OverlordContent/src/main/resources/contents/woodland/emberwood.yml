  emberwood_log:
    type: custom_block
    display-name: "<#ff8a2a>Emberwood Log"
    resource:
      model: block/emberwood_log          # glows faintly: its cracks show in the dark
    block:
      axis: true                 # lies along the face it is placed against, as logs do
      tool: axe
      hardness: 2
      skill-xp: 2

  emberwood_planks:
    type: custom_block
    display-name: "<#ff8a2a>Emberwood Planks"
    resource:
      texture: block/emberwood_planks
    block:
      tool: axe
      hardness: 2

  emberwood_leaves:
    type: custom_block
    display-name: "<#ff8a2a>Emberwood Leaves"
    resource:
      model: block/emberwood_leaves          # sparks drawn bright in the dark
    block:
      shape: leaves             # see-through, mined fast with shears or a hoe
      drops:                    # without shears or silk touch
        - {item: woodland:emberwood_sapling, chance: 0.05}
        - {item: STICK, amount: 1-2, chance: 0.02}

recipes:

  emberwood_planks:
    type: shapeless
    ingredients: [woodland:emberwood_log]
    result: woodland:emberwood_planks 4
    group: woodland_planks
    category: building
