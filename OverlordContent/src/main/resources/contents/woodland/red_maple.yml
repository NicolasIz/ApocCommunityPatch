  red_maple_log:
    type: custom_block
    display-name: "<#e0472a>Red Maple Log"
    resource:
      parent: block/cube_column
      textures:
        side: block/red_maple_log
        end: block/red_maple_log_top
    block:
      axis: true                 # lies along the face it is placed against, as logs do
      tool: axe
      hardness: 2
      skill-xp: 2

  red_maple_planks:
    type: custom_block
    display-name: "<#e0472a>Red Maple Planks"
    resource:
      texture: block/red_maple_planks
    block:
      tool: axe
      hardness: 2

  red_maple_leaves:
    type: custom_block
    display-name: "<#e0472a>Red Maple Leaves"
    resource:
      texture: block/red_maple_leaves
    block:
      shape: leaves             # see-through, mined fast with shears or a hoe
      drops:                    # without shears or silk touch
        - {item: woodland:red_maple_sapling, chance: 0.05}
        - {item: STICK, amount: 1-2, chance: 0.02}

recipes:

  red_maple_planks:
    type: shapeless
    ingredients: [woodland:red_maple_log]
    result: woodland:red_maple_planks 4
    group: woodland_planks
    category: building
