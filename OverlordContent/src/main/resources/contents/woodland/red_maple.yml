# ---------------------------------------------------------------------------
#  Red Maple (5.5) - Burns red all year round.
# ---------------------------------------------------------------------------
#  A sapling planted on its soil grows, in two stages, into a tree drawn
#  block by block below in its blueprints: one picked at random, turned and
#  mirrored, coming up over a few seconds. Bone meal hurries it along.
#  Its leaves are its own: they fall when the tree is cut down, dropping a
#  sapling now and then; shears or silk touch take them whole.
#
#     /customgive <player> woodland:red_maple_sapling
# ---------------------------------------------------------------------------

namespace: woodland

items:

  red_maple_sapling:
    type: custom_crop
    display-name: "<#e0472a>Red Maple Sapling"
    lore:
      - "<gray>Burns red all year round."
      - "<dark_gray>Plant on grass or dirt."
    resource:
      texture: crop/red_maple_sapling_1
    crop:
      stages:
        - crop/red_maple_sapling_0
        - crop/red_maple_sapling_1
      stage-seconds: 300
      min-light: 9
      bone-meal: true
      tree:
        log: red_maple_log
        leaves: red_maple_leaves
        growth-seconds: 3.0
        generation:
          biomes: [minecraft:forest, minecraft:windswept_forest]
          per-chunk: 1
          chance: 0.25
        blueprints:
          - weight: 3
            origin: [5, 3]
            legend:
              "#": log
              "-": log-x
              "|": log-z
              "@": leaves
              "%": {block: leaves, chance: 0.7}
