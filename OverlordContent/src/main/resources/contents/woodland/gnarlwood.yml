# ---------------------------------------------------------------------------
#  Gnarlwood (5.5) - Old beyond counting, mossy and crooked.
# ---------------------------------------------------------------------------
#  A sapling planted on its soil grows, in two stages, into a tree drawn
#  block by block below in its blueprints: one picked at random, turned and
#  mirrored, coming up over a few seconds. Bone meal hurries it along.
#  Its leaves are its own: they fall when the tree is cut down, dropping a
#  sapling now and then; shears or silk touch take them whole.
#
#     /customgive <player> woodland:gnarlwood_sapling
# ---------------------------------------------------------------------------

namespace: woodland

items:

  gnarlwood_sapling:
    type: custom_crop
    display-name: "<#7f9a58>Gnarlwood Sapling"
    lore:
      - "<gray>Old beyond counting, mossy and crooked."
      - "<dark_gray>Plant on grass or dirt."
    resource:
      texture: crop/gnarlwood_sapling_1
    crop:
      stages:
        - crop/gnarlwood_sapling_0
        - crop/gnarlwood_sapling_1
      stage-seconds: 300
      min-light: 9
      soil: [GRASS_BLOCK, DIRT, PODZOL, COARSE_DIRT]
      bone-meal: true
      tree:
        log: gnarlwood_log
        leaves: gnarlwood_leaves
        growth-seconds: 5.0
        generation:
          biomes: [minecraft:old_growth_pine_taiga, minecraft:old_growth_spruce_taiga, minecraft:taiga]
          soil: [grass_block, dirt, podzol, coarse_dirt]
          per-chunk: 1
          chance: 0.1
