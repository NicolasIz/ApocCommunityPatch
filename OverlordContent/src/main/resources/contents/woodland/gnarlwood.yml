  gnarlwood_log:
    type: custom_block
    display-name: "<#7f9a58>Gnarlwood Log"
    resource:
      parent: block/cube_column
      textures:
        side: block/gnarlwood_log
        end: block/gnarlwood_log_top
    block:
      axis: true                 # lies along the face it is placed against, as logs do
      tool: axe
      hardness: 2
      skill-xp: 2

  gnarlwood_planks:
    type: custom_block
    display-name: "<#7f9a58>Gnarlwood Planks"
    resource:
      texture: block/gnarlwood_planks
    block:
      tool: axe
      hardness: 2

  gnarlwood_leaves:
    type: custom_block
    display-name: "<#7f9a58>Gnarlwood Leaves"
    resource:
      texture: block/gnarlwood_leaves
    block:
      shape: leaves             # see-through, mined fast with shears or a hoe
      drops:                    # without shears or silk touch
        - {item: woodland:gnarlwood_sapling, chance: 0.05}
        - {item: STICK, amount: 1-2, chance: 0.02}

  gnarlwood_moss:
    type: custom_block
    display-name: "<#7f9a58>Gnarlwood Moss"
    lore: ["<gray>Grey-green beards of an old tree."]
    resource:
      parent: block/cross
      textures:
        cross: block/gnarlwood_moss
    block:
      shape: leaves
      drops:
        - {item: woodland:gnarlwood_sapling, chance: 0.02}

recipes:

  gnarlwood_planks:
    type: shapeless
    ingredients: [woodland:gnarlwood_log]
    result: woodland:gnarlwood_planks 4
    group: woodland_planks
    category: building
