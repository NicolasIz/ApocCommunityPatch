# ---------------------------------------------------------------------------
#  Toadstool (5.5) - A mushroom grown as tall as a tree.
# ---------------------------------------------------------------------------
#  A sapling planted on its soil grows, in two stages, into a tree drawn
#  block by block below in its blueprints: one picked at random, turned and
#  mirrored, coming up over a few seconds. Bone meal hurries it along.
#  Its leaves are its own: they fall when the tree is cut down, dropping a
#  sapling now and then; shears or silk touch take them whole.
#
#     /customgive <player> woodland:toadstool_sapling
# ---------------------------------------------------------------------------

namespace: woodland

items:

  toadstool_sapling:
    type: custom_crop
    display-name: "<#e2453b>Toadstool Spore"
    lore:
      - "<gray>A mushroom grown as tall as a tree."
      - "<dark_gray>Plant on mycelium or dirt."
    resource:
      texture: crop/toadstool_sapling_1
    crop:
      stages:
        - crop/toadstool_sapling_0
        - crop/toadstool_sapling_1
      stage-seconds: 300
      min-light: 0
      soil: [MYCELIUM, GRASS_BLOCK, DIRT, PODZOL]
      bone-meal: true
      tree:
        log: toadstool_log
        leaves: toadstool_leaves
        growth-seconds: 2.5
        generation:
          biomes: [minecraft:mushroom_fields, minecraft:dark_forest]
          soil: [mycelium, grass_block, dirt, podzol]
          per-chunk: 1
          chance: 0.2
        blueprints:
          - weight: 3
            origin: [3, 3]
            legend:
              "#": log
              "-": log-x
              "|": log-z
              "@": leaves
              "g": toadstool_gills
            layers:
              # y = 0
              - [".", ".", ".", "...#", ".", ".", "."]
              # y = 1
              - [".", ".", ".", "...#", ".", ".", "."]
              # y = 2
              - [".", ".", ".", "...#", ".", ".", "."]
              # y = 3
              - [".", ".", "...g", "..g#g", "...g", ".", "."]
              # y = 4
              - [".", ".", ".", "...#", ".", ".", "."]
              # y = 5
              - ["..@@@", ".@ggg@", "@ggggg@", "@ggggg@", "@ggggg@", ".@ggg@", "..@@@"]
              # y = 6
              - ["..@@@", ".@@@@@", "@@@@@@@", "@@@@@@@", "@@@@@@@", ".@@@@@", "..@@@"]
              # y = 7
              - [".", "..@@@", ".@@@@@", ".@@@@@", ".@@@@@", "..@@@", "."]
          - weight: 2
            origin: [4, 4]
            legend:
              "#": log
              "-": log-x
              "|": log-z
              "@": leaves
              "g": toadstool_gills
            layers:
              # y = 0
              - [".", ".", ".", ".", "....##", "....##", ".", ".", ".", "."]
              # y = 1
              - [".", ".", ".", ".", "....##", "....##", ".", ".", ".", "."]
              # y = 2
              - [".", ".", ".", ".", "....##", "....##", ".", ".", ".", "."]
              # y = 3
              - [".", ".", ".", ".", "....##", "....##", ".", ".", ".", "."]
              # y = 4
              - [".", ".", ".", ".", "....##", "....##", ".", ".", ".", "."]
              # y = 5
              - [".", ".", ".", "....gg", "...g##g", "...g##g", "....gg", ".", ".", "."]
              # y = 6
              - ["....@@", ".", ".", ".", "@...##...@", "@...##...@", ".", ".", ".", "....@@"]
              # y = 7
              - ["....@@", "..@@..@@", ".@.gggg.@", ".@gggggg@", "@.gggggg.@", "@.gggggg.@", ".@gggggg@", ".@.gggg.@", "..@@..@@", "....@@"]
              # y = 8
              - [".", "..@@@@@@", ".@@@@@@@@", ".@@@@@@@@", ".@@@@@@@@", ".@@@@@@@@", ".@@@@@@@@", ".@@@@@@@@", "..@@@@@@", "."]
              # y = 9
              - [".", "....@@", "..@@@@@@", "..@@@@@@", ".@@@@@@@@", ".@@@@@@@@", "..@@@@@@", "..@@@@@@", "....@@", "."]
          - weight: 2
            origin: [3, 3]
            legend:
              "#": log
              "-": log-x
              "|": log-z
              "@": leaves
              "g": toadstool_gills
            layers:
              # y = 0
              - [".", ".", ".", "...#", ".", ".", "."]
              # y = 1
              - [".", ".", ".", "...#", ".", ".", "."]
              # y = 2
              - [".", ".", ".", "...#", ".", ".", "."]
              # y = 3
              - ["...@", ".", ".", "@..#..@", ".", ".", "...@"]
              # y = 4
              - ["...@", ".@@g@@", ".@ggg@", "@ggggg@", ".@ggg@", ".@@g@@", "...@"]
              # y = 5
              - [".", ".@@@@@", ".@@@@@", ".@@@@@", ".@@@@@", ".@@@@@", "."]
              # y = 6
              - [".", ".", "..@@@", "..@@@", "..@@@", ".", "."]

  toadstool_log:
    type: custom_block
    display-name: "<#e2453b>Toadstool Stem"
    resource:
      parent: block/cube_column
      textures:
        side: block/toadstool_log
        end: block/toadstool_log_top
    block:
      axis: true                 # lies along the face it is placed against, as logs do
      tool: axe
      hardness: 2
      skill-xp: 2

  toadstool_planks:
    type: custom_block
    display-name: "<#e2453b>Toadstool Planks"
    resource:
      texture: block/toadstool_planks
    block:
      tool: axe
      hardness: 2

  toadstool_leaves:
    type: custom_block
    display-name: "<#e2453b>Toadstool Cap"
    resource:
      texture: block/toadstool_leaves
    block:
      shape: leaves             # see-through, mined fast with shears or a hoe
      drops:                    # without shears or silk touch
        - {item: woodland:toadstool_sapling, chance: 0.05}
        - {item: STICK, amount: 1-2, chance: 0.02}

  toadstool_gills:
    type: custom_block
    display-name: "<#e2453b>Toadstool Gills"
    lore: ["<gray>The pale underside of a toadstool's cap."]
    resource:
      texture: block/toadstool_gills
    block:
      shape: leaves
      drops:
        - {item: woodland:toadstool_sapling, chance: 0.02}

recipes:

  toadstool_planks:
    type: shapeless
    ingredients: [woodland:toadstool_log]
    result: woodland:toadstool_planks 4
    group: woodland_planks
    category: building
