# ---------------------------------------------------------------------------
#  Sunshade (5.5) - Opens golden parasols over the plains.
# ---------------------------------------------------------------------------
#  A sapling planted on its soil grows, in two stages, into a tree drawn
#  block by block below in its blueprints: one picked at random, turned and
#  mirrored, coming up over a few seconds. Bone meal hurries it along.
#  Its leaves are its own: they fall when the tree is cut down, dropping a
#  sapling now and then; shears or silk touch take them whole.
#
#     /customgive <player> woodland:sunshade_sapling
# ---------------------------------------------------------------------------

namespace: woodland

items:

  sunshade_sapling:
    type: custom_crop
    display-name: "<#f2c13a>Sunshade Sapling"
    lore:
      - "<gray>Opens golden parasols over the plains."
      - "<dark_gray>Plant on grass or dirt."
    resource:
      texture: crop/sunshade_sapling_1
    crop:
      stages:
        - crop/sunshade_sapling_0
        - crop/sunshade_sapling_1
      stage-seconds: 300
      min-light: 9
      bone-meal: true
      tree:
        log: sunshade_log
        leaves: sunshade_leaves
        growth-seconds: 3.0
        generation:
          biomes: [minecraft:plains, minecraft:sunflower_plains, minecraft:windswept_savanna]
          per-chunk: 1
          chance: 0.08
        blueprints:
          - weight: 3
            origin: [6, 4]
            legend:
              "#": log
              "-": log-x
              "|": log-z
              "@": leaves
              "%": {block: leaves, chance: 0.7}
