  sunshade_log:
    type: custom_block
    display-name: "<#f2c13a>Sunshade Log"
    resource:
      parent: block/cube_column
      textures:
        side: block/sunshade_log
        end: block/sunshade_log_top
    block:
      axis: true                 # lies along the face it is placed against, as logs do
      tool: axe
      hardness: 2
      skill-xp: 2

  sunshade_planks:
    type: custom_block
    display-name: "<#f2c13a>Sunshade Planks"
    resource:
      texture: block/sunshade_planks
    block:
      tool: axe
      hardness: 2

  sunshade_leaves:
    type: custom_block
    display-name: "<#f2c13a>Sunshade Leaves"
    resource:
      texture: block/sunshade_leaves
    block:
      shape: leaves             # see-through, mined fast with shears or a hoe
      drops:                    # without shears or silk touch
        - {item: woodland:sunshade_sapling, chance: 0.05}
        - {item: STICK, amount: 1-2, chance: 0.02}

recipes:

  sunshade_planks:
    type: shapeless
    ingredients: [woodland:sunshade_log]
    result: woodland:sunshade_planks 4
    group: woodland_planks
    category: building
