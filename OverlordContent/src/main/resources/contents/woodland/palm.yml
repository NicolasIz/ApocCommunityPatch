  palm_log:
    type: custom_block
    display-name: "<#e0c27d>Palm Log"
    resource:
      parent: block/cube_column
      textures:
        side: block/palm_log
        end: block/palm_log_top
    block:
      axis: true                 # lies along the face it is placed against, as logs do
      tool: axe
      hardness: 2
      skill-xp: 2

  palm_planks:
    type: custom_block
    display-name: "<#e0c27d>Palm Planks"
    resource:
      texture: block/palm_planks
    block:
      tool: axe
      hardness: 2

  palm_leaves:
    type: custom_block
    display-name: "<#e0c27d>Palm Leaves"
    resource:
      texture: block/palm_leaves
    block:
      shape: leaves             # see-through, mined fast with shears or a hoe
      drops:                    # without shears or silk touch
        - {item: woodland:palm_sapling, chance: 0.05}
        - {item: STICK, amount: 1-2, chance: 0.02}

  palm_coconuts:
    type: custom_block
    display-name: "<#e0c27d>Coconut Cluster"
    lore: ["<gray>Knock it down: a palm sapling may be inside."]
    resource:
      model: block/palm_coconuts
    block:
      shape: leaves
      drops:
        - {item: woodland:palm_sapling, chance: 0.3}

recipes:

  palm_planks:
    type: shapeless
    ingredients: [woodland:palm_log]
    result: woodland:palm_planks 4
    group: woodland_planks
    category: building
