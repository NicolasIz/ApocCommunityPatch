# ---------------------------------------------------------------------------
#  Cloudpuff (5.5) - Grows clouds where other trees grow leaves.
# ---------------------------------------------------------------------------
#  A sapling planted on its soil grows, in two stages, into a tree drawn
#  block by block below in its blueprints: one picked at random, turned and
#  mirrored, coming up over a few seconds. Bone meal hurries it along.
#  Its leaves are its own: they fall when the tree is cut down, dropping a
#  sapling now and then; shears or silk touch take them whole.
#
#     /customgive <player> woodland:cloudpuff_sapling
# ---------------------------------------------------------------------------

namespace: woodland

items:

  cloudpuff_sapling:
    type: custom_crop
    display-name: "<#eef4fa>Cloudpuff Sapling"
    lore:
      - "<gray>Grows clouds where other trees grow leaves."
      - "<dark_gray>Plant on grass or dirt."
    resource:
      texture: crop/cloudpuff_sapling_1
    crop:
      stages:
        - crop/cloudpuff_sapling_0
        - crop/cloudpuff_sapling_1
      stage-seconds: 300
      min-light: 9
      bone-meal: true
      tree:
        log: cloudpuff_log
        leaves: cloudpuff_leaves
        growth-seconds: 3.0
        generation:
          biomes: [minecraft:meadow, minecraft:windswept_hills]
          per-chunk: 1
          chance: 0.25
        blueprints:
          - weight: 3
            origin: [5, 5]
            legend:
              "#": log
              "-": log-x
              "|": log-z
              "@": leaves
            layers:
              # y = 0
              - [".", ".", ".", ".", ".", ".....#", ".", ".", "."]
              # y = 1
              - [".", ".", ".", ".", ".", ".....#", ".", ".", "."]
              # y = 2
              - [".", ".", ".", ".", ".", ".....#", ".", ".", "."]
              # y = 3
              - [".", ".", ".", ".", ".", "....--", ".", ".", "."]
              # y = 4
              - [".", ".", ".", ".", ".", ".----||", "......|", ".", "."]
              # y = 5
              - [".", ".", ".", ".", "@@@..|", "@-@..|", "@@@...--", ".......-", "."]
              # y = 6
              - [".", ".", "......|", ".....||", "@@@..|", "@@@@.#", "@@@.....@", ".......--@", "........@"]
              # y = 7
              - [".", ".....@@@", ".....@|@", ".....@@@", "@@@", "@@@..#", "@@@....@@@", ".......@@@", ".......@@@"]
              # y = 8
              - ["......@", ".....@@@", "....@@@@@", ".....@@@", "....@@@", "....@#@", "....@@@.@", ".......@@@", "........@"]
              # y = 9
              - [".", ".....@@@", ".....@@@", ".....@@@", "...@@@@", "...@@@@@", "...@@@@", "....@@", "."]
              # y = 10
              - [".", ".", ".", ".", "....@@@", "....@@@", "....@@@", ".", "."]
          - weight: 2
            origin: [4, 4]
            legend:
              "#": log
              "-": log-x
              "|": log-z
              "@": leaves
            layers:
              # y = 0
              - [".", ".", ".", ".", "....#", ".", ".", ".", "."]
              # y = 1
              - [".", ".", ".", ".", "....#", ".", ".", ".", "."]
              # y = 2
              - [".", ".", ".", ".", "....#", ".", ".", ".", "."]
              # y = 3
              - [".", ".", ".", ".", "...--", ".", ".", ".", "."]
              # y = 4
              - [".", ".", ".", "......-", "..-----", ".||", ".|", ".", "."]
              # y = 5
              - [".", ".", ".", "......--", "....#", ".@", "@|@", ".@", "."]
              # y = 6
              - [".", ".", "...|....@", "...||..--@", "....||..@", "@@@..|", "@@@", "@@@", "."]
              # y = 7
              - [".", "..|", "..||...@@@", ".......@@@", "....#..@@@", ".@...||", "@@@...|", ".@", "."]
              # y = 8
              - ["..@", ".@|@", "..@.....@", ".......@@@", "....#...@", ".", "......|", ".....@|@", "......@"]
              # y = 9
              - [".@@@", ".@@@", ".@@@", ".", "....#", ".", ".....@@@", ".....@@@", ".....@@@"]
              # y = 10
              - ["..@", ".@@@", "..@", "...@@@", "...@#@", "...@@@", "......@", ".....@@@", "......@"]
              # y = 11
              - [".", ".", "...@@@", "...@@@@", "..@@@@@", "..@@@@@", "...@@", ".", "."]
              # y = 12
              - [".", ".", ".", "...@@@", "...@@@", "...@@@", ".", ".", "."]
          - weight: 2
            origin: [5, 2]
            legend:
              "#": log
              "-": log-x
              "|": log-z
              "@": leaves
            layers:
              # y = 0
              - [".", ".", ".....#", ".", "."]
              # y = 1
              - [".", ".", ".....#", ".", "."]
              # y = 2
              - [".", "...-", "...---", ".", "."]
              # y = 3
              - [".", "..##", ".....##", ".", "."]
              # y = 4
              - [".@@@", ".@#@", ".@@@.#---", "........-", "."]
              # y = 5
              - [".@@@", "@@@@@", ".@@@.#..@", ".......@-@", "........@"]
              # y = 6
              - [".@@@", ".@@@", ".@@@.#.@@@", ".......@@@", ".......@@@"]
              # y = 7
              - [".", "....@@@", "....@#@.@", "....@@@@@@", "........@"]
              # y = 8
              - ["....@@", "....@@@@", "...@@@@@", "....@@@", ".....@"]
              # y = 9
              - [".", "....@@@", "....@@@", "....@@@", "."]

  cloudpuff_log:
    type: custom_block
    display-name: "<#eef4fa>Cloudpuff Log"
    resource:
      parent: block/cube_column
      textures:
        side: block/cloudpuff_log
        end: block/cloudpuff_log_top
    block:
      axis: true                 # lies along the face it is placed against, as logs do
      tool: axe
      hardness: 2
      skill-xp: 2

  cloudpuff_planks:
    type: custom_block
    display-name: "<#eef4fa>Cloudpuff Planks"
    resource:
      texture: block/cloudpuff_planks
    block:
      tool: axe
      hardness: 2

  cloudpuff_leaves:
    type: custom_block
    display-name: "<#eef4fa>Cloudpuff Leaves"
    resource:
      texture: block/cloudpuff_leaves
    block:
      shape: leaves             # see-through, mined fast with shears or a hoe
      drops:                    # without shears or silk touch
        - {item: woodland:cloudpuff_sapling, chance: 0.05}
        - {item: STICK, amount: 1-2, chance: 0.02}

recipes:

  cloudpuff_planks:
    type: shapeless
    ingredients: [woodland:cloudpuff_log]
    result: woodland:cloudpuff_planks 4
    group: woodland_planks
    category: building
