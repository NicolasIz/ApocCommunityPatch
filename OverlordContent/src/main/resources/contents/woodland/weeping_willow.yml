  weeping_willow_log:
    type: custom_block
    display-name: "<#9cc34f>Weeping Willow Log"
    resource:
      parent: block/cube_column
      textures:
        side: block/weeping_willow_log
        end: block/weeping_willow_log_top
    block:
      axis: true                 # lies along the face it is placed against, as logs do
      tool: axe
      hardness: 2
      skill-xp: 2

  weeping_willow_planks:
    type: custom_block
    display-name: "<#9cc34f>Weeping Willow Planks"
    resource:
      texture: block/weeping_willow_planks
    block:
      tool: axe
      hardness: 2

  weeping_willow_leaves:
    type: custom_block
    display-name: "<#9cc34f>Weeping Willow Leaves"
    resource:
      texture: block/weeping_willow_leaves
    block:
      shape: leaves             # see-through, mined fast with shears or a hoe
      drops:                    # without shears or silk touch
        - {item: woodland:weeping_willow_sapling, chance: 0.05}
        - {item: STICK, amount: 1-2, chance: 0.02}

  weeping_willow_fronds:
    type: custom_block
    display-name: "<#9cc34f>Weeping Willow Fronds"
    lore: ["<gray>The trailing tips of a willow's curtains."]
    resource:
      parent: block/cross
      textures:
        cross: block/weeping_willow_fronds
    block:
      shape: leaves
      drops:
        - {item: woodland:weeping_willow_sapling, chance: 0.02}

recipes:

  weeping_willow_planks:
    type: shapeless
    ingredients: [woodland:weeping_willow_log]
    result: woodland:weeping_willow_planks 4
    group: woodland_planks
    category: building
