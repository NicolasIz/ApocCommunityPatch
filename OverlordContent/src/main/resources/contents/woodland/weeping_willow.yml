              # y = 10
              - [".", "....%", "..@@@@%", ".%@@@@@%", ".@@@@@@@", "@@@@@@@@@", ".@@@@@@@", ".@@@@@@%", "..@@@@%", "....@", "."]
          - weight: 2
            origin: [4, 3]
            legend:
              "#": log
              "-": log-x
              "|": log-z
              "@": leaves
              "%": {block: leaves, chance: 0.7}
              "f": weeping_willow_fronds
            layers:
              # y = 0
              - [".", ".", ".", "....#", ".", ".", ".", ".", "."]
              # y = 1
              - ["...f", ".", ".", "....#...f", ".", ".......f", ".ff....f", "..ff", "."]
