              - ["...@", "..@f.f", "..f...ff", "....#..f@", ".f.....@", "f@.....@@", ".%%....@", "..%@.f", "...@"]
              # y = 4
              - ["...@", "..%@.@", "..@...@@", "....#..@@", ".@..#..@", "@@.....@@", ".@@....@", "..@@.@", "...@"]
              # y = 5
              - ["...@", "..@@@@%", ".@@..|@%", ".@.|.|.@%", ".@.|||-@@", "%@--||.@@", ".%@..|@@", "..@@%@@", "...@"]
              # y = 6
              - ["...@", "..@@@@|", ".@|@@||@", ".@||@@@@@", ".@@@@@--@", "@--@@@@@@", ".-@@@||%", "..%@@@|", "...@..|"]
              # y = 7
              - [".", "..@@@@@", ".@@@@@@@", ".@@@@@@@", ".@@@@@@@@", ".@@@@@@@", ".@@@@@@@", "..%@@@@", "."]
