  spiralwood_log:
    type: custom_block
    display-name: "<#3fd0bc>Spiralwood Log"
    resource:
      parent: block/cube_column
      textures:
        side: block/spiralwood_log
        end: block/spiralwood_log_top
    block:
      axis: true                 # lies along the face it is placed against, as logs do
      tool: axe
      hardness: 2
      skill-xp: 2

  spiralwood_planks:
    type: custom_block
    display-name: "<#3fd0bc>Spiralwood Planks"
    resource:
      texture: block/spiralwood_planks
    block:
      tool: axe
      hardness: 2

  spiralwood_leaves:
    type: custom_block
    display-name: "<#3fd0bc>Spiralwood Leaves"
    resource:
      texture: block/spiralwood_leaves
    block:
      shape: leaves             # see-through, mined fast with shears or a hoe
      drops:                    # without shears or silk touch
        - {item: woodland:spiralwood_sapling, chance: 0.05}
        - {item: STICK, amount: 1-2, chance: 0.02}

recipes:

  spiralwood_planks:
    type: shapeless
    ingredients: [woodland:spiralwood_log]
    result: woodland:spiralwood_planks 4
    group: woodland_planks
    category: building
