# ---------------------------------------------------------------------------
#  Spiralwood (5.5) - Its leaves wind round it as it climbs.
# ---------------------------------------------------------------------------
#  A sapling planted on its soil grows, in two stages, into a tree drawn
#  block by block below in its blueprints: one picked at random, turned and
#  mirrored, coming up over a few seconds. Bone meal hurries it along.
#  Its leaves are its own: they fall when the tree is cut down, dropping a
#  sapling now and then; shears or silk touch take them whole.
#
#     /customgive <player> woodland:spiralwood_sapling
# ---------------------------------------------------------------------------

namespace: woodland

items:

  spiralwood_sapling:
    type: custom_crop
    display-name: "<#3fd0bc>Spiralwood Sapling"
    lore:
      - "<gray>Its leaves wind round it as it climbs."
      - "<dark_gray>Plant on grass or dirt."
    resource:
      texture: crop/spiralwood_sapling_1
    crop:
      stages:
        - crop/spiralwood_sapling_0
        - crop/spiralwood_sapling_1
      stage-seconds: 300
      min-light: 9
      bone-meal: true
      tree:
        log: spiralwood_log
        leaves: spiralwood_leaves
        growth-seconds: 3.5
        generation:
          biomes: [minecraft:jungle, minecraft:sparse_jungle, minecraft:bamboo_jungle]
          per-chunk: 1
          chance: 0.2
        blueprints:
          - weight: 3
            origin: [3, 3]
            legend:
              "#": log
              "-": log-x
              "|": log-z
              "@": leaves
            layers:
              # y = 0
              - [".", ".", ".", "...#", ".", ".", "."]
              # y = 1
              - [".", ".", ".", "...#", "....#", ".", "."]
              # y = 2
              - [".", ".", ".", "...#", "...|", ".", "."]
              # y = 3
              - [".", ".", ".", ".@@#", ".@#", "..@", "."]
              # y = 4
              - [".", ".", "@@@", "@@-#", ".", ".", "."]
              # y = 5
              - ["..@", ".@@", ".@#", "...#", ".", ".", "."]
              # y = 6
              - ["..@@.@", "...@@", "...|", "...#", ".", ".", "."]
              # y = 7
              - [".....@", "....@@@", "....#@@", "...#", ".", ".", "."]
              # y = 8
              - [".", ".", ".....@@", "...#-.@@", ".....@@", ".", "."]
              # y = 9
              - [".", ".", ".", "...#", "....#@", "....@@@", "....@@"]
              # y = 10
              - [".", ".", ".", "...#", ".", "..@@@", "..@@@"]
              # y = 11
              - [".", ".", "...@", "..@#@", "@@@@", ".@@", "..@"]
              # y = 12
              - [".", ".", "@.@@@", "@@@@@", ".@@@@", ".", "."]
              # y = 13
              - [".", ".", "...@", "..@@@", "...@", ".", "."]
          - weight: 2
            origin: [3, 3]
            legend:
              "#": log
              "-": log-x
              "|": log-z
              "@": leaves
            layers:
              # y = 0
              - [".", ".", ".", "...#", ".", ".", "."]
              # y = 1
              - [".", ".", "....#", "...#", ".", ".", "."]
              # y = 2
              - [".", ".", "...|", "...#", ".", ".", "."]
              # y = 3
              - [".", "..@@", "..#@", "...#", ".", ".", "."]
              # y = 4
              - [".", ".@", ".@@", "@@-#", ".", ".", "."]
              # y = 5
              - [".", ".", ".", "@@.#", "@@#", ".@", "."]
              # y = 6
              - [".", ".", ".", "...#", ".@.|", "@.@@", ".@@"]
              # y = 7
              - [".", ".", ".", "...#", "....#", "...@@", "..@.@@"]
              # y = 8
