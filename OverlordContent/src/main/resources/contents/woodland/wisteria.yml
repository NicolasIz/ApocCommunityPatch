  wisteria_log:
    type: custom_block
    display-name: "<#b38be6>Wisteria Log"
    resource:
      parent: block/cube_column
      textures:
        side: block/wisteria_log
        end: block/wisteria_log_top
    block:
      axis: true                 # lies along the face it is placed against, as logs do
      tool: axe
      hardness: 2
      skill-xp: 2

  wisteria_planks:
    type: custom_block
    display-name: "<#b38be6>Wisteria Planks"
    resource:
      texture: block/wisteria_planks
    block:
      tool: axe
      hardness: 2

  wisteria_leaves:
    type: custom_block
    display-name: "<#b38be6>Wisteria Leaves"
    resource:
      texture: block/wisteria_leaves
    block:
      shape: leaves             # see-through, mined fast with shears or a hoe
      drops:                    # without shears or silk touch
        - {item: woodland:wisteria_sapling, chance: 0.05}
        - {item: STICK, amount: 1-2, chance: 0.02}

  wisteria_blossom:
    type: custom_block
    display-name: "<#b38be6>Wisteria Blossom"
    lore: ["<gray>Lilac flowers that hang in long trails."]
    resource:
      parent: block/cross
      textures:
        cross: block/wisteria_blossom
    block:
      shape: leaves
      drops:
        - {item: woodland:wisteria_sapling, chance: 0.02}

recipes:

  wisteria_planks:
    type: shapeless
    ingredients: [woodland:wisteria_log]
    result: woodland:wisteria_planks 4
    group: woodland_planks
    category: building
