# ---------------------------------------------------------------------------
#  Wisteria (5.5) - Lilac blossom hanging in long trails.
# ---------------------------------------------------------------------------
#  A sapling planted on its soil grows, in two stages, into a tree drawn
#  block by block below in its blueprints: one picked at random, turned and
#  mirrored, coming up over a few seconds. Bone meal hurries it along.
#  Its leaves are its own: they fall when the tree is cut down, dropping a
#  sapling now and then; shears or silk touch take them whole.
#
#     /customgive <player> woodland:wisteria_sapling
# ---------------------------------------------------------------------------

namespace: woodland

items:

  wisteria_sapling:
    type: custom_crop
    display-name: "<#b38be6>Wisteria Sapling"
    lore:
      - "<gray>Lilac blossom hanging in long trails."
      - "<dark_gray>Plant on grass or dirt."
    resource:
      texture: crop/wisteria_sapling_1
    crop:
      stages:
        - crop/wisteria_sapling_0
        - crop/wisteria_sapling_1
      stage-seconds: 300
      min-light: 9
      bone-meal: true
      tree:
        log: wisteria_log
        leaves: wisteria_leaves
        growth-seconds: 3.5
        generation:
          biomes: [minecraft:flower_forest, minecraft:cherry_grove]
          per-chunk: 1
          chance: 0.3
        blueprints:
          - weight: 3
            origin: [8, 3]
            legend:
              "#": log
              "-": log-x
              "|": log-z
              "@": leaves
              "%": {block: leaves, chance: 0.7}
              "b": wisteria_blossom
            layers:
              # y = 0
              - [".", ".", ".", "........#", ".", ".", ".", ".", ".", "."]
              # y = 1
              - [".", ".", "............b", ".......##b", ".", ".", ".", ".", ".", "."]
              # y = 2
