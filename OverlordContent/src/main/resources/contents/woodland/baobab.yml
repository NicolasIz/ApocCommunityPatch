  baobab_log:
    type: custom_block
    display-name: "<#b7a07c>Baobab Log"
    resource:
      parent: block/cube_column
      textures:
        side: block/baobab_log
        end: block/baobab_log_top
    block:
      axis: true                 # lies along the face it is placed against, as logs do
      tool: axe
      hardness: 2
      skill-xp: 2

  baobab_planks:
    type: custom_block
    display-name: "<#b7a07c>Baobab Planks"
    resource:
      texture: block/baobab_planks
    block:
      tool: axe
      hardness: 2

  baobab_leaves:
    type: custom_block
    display-name: "<#b7a07c>Baobab Leaves"
    resource:
      texture: block/baobab_leaves
    block:
      shape: leaves             # see-through, mined fast with shears or a hoe
      drops:                    # without shears or silk touch
        - {item: woodland:baobab_sapling, chance: 0.05}
        - {item: STICK, amount: 1-2, chance: 0.02}

recipes:

  baobab_planks:
    type: shapeless
    ingredients: [woodland:baobab_log]
    result: woodland:baobab_planks 4
    group: woodland_planks
    category: building
