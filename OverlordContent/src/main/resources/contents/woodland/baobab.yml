# ---------------------------------------------------------------------------
#  Baobab (5.5) - A bottle of a trunk, a crown of stubby arms.
# ---------------------------------------------------------------------------
#  A sapling planted on its soil grows, in two stages, into a tree drawn
#  block by block below in its blueprints: one picked at random, turned and
#  mirrored, coming up over a few seconds. Bone meal hurries it along.
#  Its leaves are its own: they fall when the tree is cut down, dropping a
#  sapling now and then; shears or silk touch take them whole.
#
#     /customgive <player> woodland:baobab_sapling
# ---------------------------------------------------------------------------

namespace: woodland

items:

  baobab_sapling:
    type: custom_crop
    display-name: "<#b7a07c>Baobab Sapling"
    lore:
      - "<gray>A bottle of a trunk, a crown of stubby arms."
      - "<dark_gray>Plant on grass or dirt."
    resource:
      texture: crop/baobab_sapling_1
    crop:
      stages:
        - crop/baobab_sapling_0
        - crop/baobab_sapling_1
      stage-seconds: 300
      min-light: 9
      soil: [GRASS_BLOCK, DIRT, COARSE_DIRT]
      bone-meal: true
      tree:
        log: baobab_log
        leaves: baobab_leaves
        growth-seconds: 4.0
        generation:
          biomes: [minecraft:savanna, minecraft:savanna_plateau]
          soil: [grass_block, dirt, coarse_dirt]
          per-chunk: 1
          chance: 0.12
