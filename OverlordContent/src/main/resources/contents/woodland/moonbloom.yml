  moonbloom_log:
    type: custom_block
    display-name: "<#bfe0ff>Moonbloom Log"
    resource:
      parent: block/cube_column
      textures:
        side: block/moonbloom_log
        end: block/moonbloom_log_top
    block:
      axis: true                 # lies along the face it is placed against, as logs do
      tool: axe
      hardness: 2
      skill-xp: 2

  moonbloom_planks:
    type: custom_block
    display-name: "<#bfe0ff>Moonbloom Planks"
    resource:
      texture: block/moonbloom_planks
    block:
      tool: axe
      hardness: 2

  moonbloom_leaves:
    type: custom_block
    display-name: "<#bfe0ff>Moonbloom Leaves"
    resource:
      model: block/moonbloom_leaves          # sparks drawn bright in the dark
    block:
      shape: leaves             # see-through, mined fast with shears or a hoe
      drops:                    # without shears or silk touch
        - {item: woodland:moonbloom_sapling, chance: 0.05}
        - {item: STICK, amount: 1-2, chance: 0.02}

recipes:

  moonbloom_planks:
    type: shapeless
    ingredients: [woodland:moonbloom_log]
    result: woodland:moonbloom_planks 4
    group: woodland_planks
    category: building
