# ---------------------------------------------------------------------------
#  Moonbloom (5.5) - A lantern of silver leaves that glows in the night.
# ---------------------------------------------------------------------------
#  A sapling planted on its soil grows, in two stages, into a tree drawn
#  block by block below in its blueprints: one picked at random, turned and
#  mirrored, coming up over a few seconds. Bone meal hurries it along.
#  Its leaves are its own: they fall when the tree is cut down, dropping a
#  sapling now and then; shears or silk touch take them whole.
#
#     /customgive <player> woodland:moonbloom_sapling
# ---------------------------------------------------------------------------

namespace: woodland

items:

  moonbloom_sapling:
    type: custom_crop
    display-name: "<#bfe0ff>Moonbloom Sapling"
    lore:
      - "<gray>A lantern of silver leaves that glows in the night."
      - "<dark_gray>Plant on grass or dirt."
    resource:
      texture: crop/moonbloom_sapling_1
    crop:
      stages:
        - crop/moonbloom_sapling_0
        - crop/moonbloom_sapling_1
      stage-seconds: 300
      min-light: 9
      bone-meal: true
      tree:
        log: moonbloom_log
        leaves: moonbloom_leaves
        growth-seconds: 3.5
        generation:
          biomes: [minecraft:birch_forest, minecraft:old_growth_birch_forest, minecraft:pale_garden]
          per-chunk: 1
          chance: 0.15
        blueprints:
          - weight: 3
            origin: [3, 3]
            legend:
              "#": log
              "-": log-x
              "|": log-z
              "@": leaves
            layers:
              # y = 0
              - [".", ".", ".", "...#", ".", ".", "."]
              # y = 1
