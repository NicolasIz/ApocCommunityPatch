# ---------------------------------------------------------------------------
#  La mina (3.5): 87 piezas.
#  montones de mineral, vagonetas, cestas y cajas de mineral, cristales, geodas, rocas,
#  estalagmitas, puntales, faroles, picos, cribas, pólvora, vías, el torno del pozo y la mesa del tasador.
#  Clic derecho: se abren, sientan, encienden, dan su efecto o abren su mesa de trabajo.
#  /arkcontent showcase medieval_mineria las coloca todas delante de ti.
# ---------------------------------------------------------------------------

items:
