# ---------------------------------------------------------------------------
#  OverlordContent (formerly ArkcronistContent)
# ---------------------------------------------------------------------------
#  Items are defined in plugins/OverlordContent/contents/ - one folder per
#  content pack, any number of .yml files inside it. See contents/demo/ for a
#  worked example (written the first time the plugin starts).
#
#  /arkcontent reload rebuilds items and the resource pack from contents/.
#  Changes to THIS file need a restart.
# ---------------------------------------------------------------------------

# Write the demo content pack into contents/ when that folder does not exist yet.
# On an upgrade, also add to contents/demo/ the examples later versions brought
# (1.1 crops and emojis, 1.3 chest and bed, 1.4 armour) - never over a file that
# is there, never into contents/demo/ if it was deleted, and never twice.
extract-examples: true

pack:
  # Shown in the client's resource pack list. MiniMessage.
  description: "<gold>Arkcronist</gold> <gray>custom content"
  # Resource pack formats the pack declares it supports. 46 is 1.21.4, the first
  # release that can draw these items at all; 99 leaves room for later clients.
  # 'format' must lie between the two.
  format: 46
  min-format: 46
  max-format: 99
  # Other plugins' resource packs to merge into this one, so players get one
  # pack: folders holding assets/, or zips, relative to the server folder. Their
  # overlays (the folders their pack.mcmeta declares) come with them. Every folder
  # or zip in plugins/OverlordContent/packs/ is merged as well: that is where
  # /arkcontent import puts ItemsAdder's generated pack, byte for byte.
  # Shared files - fonts, atlases, sounds.json, lang files, blockstates and vanilla
  # items' custom_model_data lists - are combined. The custom_model_data numbers and
  # font characters a merged pack uses are never given to an item or emoji of ours
  # (one that had one is given a free one, and that is reported); a clash left over
  # keeps ours, except inside the merged pack's own overlays, where its entry wins.
  # e.g.
  #   merge:
  #     - plugins/CosmeticsCore/resourcepack
  #     - packs/hats.zip
  merge: []
  # Each item made from a plain vanilla material (PAPER, STICK, a sword...) is also drawn
  # by a custom_model_data number, the way ItemsAdder's items are: for plugins that only
  # take a material and a number - ClueScrolls, Holographic Displays, menus' model_data,
  # rewards. The number never changes (data/custom_model_data.json); see an item's with
  # /arkcontent cmd <item> or %arkcontent_cmd_<namespace:id>%. Materials with special
  # vanilla definitions - bows, banners, trimmed armour, clocks - are left out.
  custom-model-data:
    enabled: true
    first: 10000
  # A sounds.json name with no namespace ("golem/roar") is read by the client as
  # minecraft:golem/roar, so when its .ogg is in the sounds.json's own namespace
  # (assets/bosses/sounds/golem/roar.ogg) the event plays nothing. On, such names are
  # written bosses:golem/roar in the pack players get - the source files stay as
  # they are; off, they are only reported. Only the name changes: volume, pitch,
  # weight, streaming and the .ogg itself are left alone.
  fix-sound-names: true
  # 3.5.3: ItemsAdder's generated pack silences vanilla wood and stone (block.wood.* and
  # block.stone.*: placing, breaking, hitting, stepping, falling) and ItemsAdder plays them
  # itself. Merged here with no ItemsAdder on the server, every wooden or stone block, step
  # and blow is silent - and so is any animation or skill that plays those sounds. On, the
  # vanilla sounds a merged pack silences play again (not while ItemsAdder is installed).
  unsilence-vanilla-sounds: true
  # Shaders - a content pack's (contents/<pack>/shaders/) and every merged pack's - are
  # read against what the 1.21.8 client does with them, and each problem is reported:
  # written for 1.21.4 or older (loose uniforms, which 1.21.5+ never sets), an import
  # nothing provides, a core shader the client no longer loads, a uniform block it is
  # never given. keep: report only. drop-broken: also leave out each shader that would
  # not compile or draws wrong, with its other half. drop: leave out every shader.
  shaders: keep
  # Space characters in the font that move text by whole pixels, right or left
  # (U+F801-F80F back, U+F821-F82F forward). HUDs use them; menus and scoreboards can
  # too, through %arkcontent_space_<pixels>%. Written even with no HUD or emoji.
  negative-spaces: true

http:
  # The built-in web server that hands the pack to players. With it off, the pack
  # is still built (plugins/OverlordContent/output/resource_pack.zip) for you to
  # host elsewhere, and nothing is sent to players.
  enabled: true
  # Interface to listen on. 0.0.0.0 means all of them.
  bind-address: "0.0.0.0"
  # Must be reachable from players' machines: open or forward it like the game port.
  port: 8163
  # The address players' clients download from - your public IP or domain, NOT
  # 0.0.0.0. Empty: this server's public IP is found at start (see below); until
  # then, and if it cannot be, server-ip from server.properties, or 127.0.0.1,
  # which only works for a client on this same machine.
  public-address: ""
  # With public-address empty, ask these services for this machine's public IP
  # - one light HTTPS request at start, off the main thread - and send players
  # that. A server-ip that is already a public address is kept instead. Nothing
  # is written back to this file: an empty line follows a host that changes IP.
  detect-public-address: true
  address-services:
    - "https://api.ipify.org"
    - "https://checkip.amazonaws.com"
    - "https://icanhazip.com"
    - "https://ifconfig.me/ip"
  # If 'port' cannot be opened (in use, or refused - below 1024 without root),
  # the plugin starts anyway and tries: the same port twice more (a previous run
  # may still hold it), then these ports, then 'port' again every 60 seconds.
  # Empty: the three ports after 'port'. Players can only download from a port
  # that is open to them, so list ports your host forwards. Admins are told.
  fallback-ports: []
  # Downloads served at the same time. More players than this simply queue.
  threads: 4
  # Host the pack yourself instead: a CDN, a web host, a bucket. Players are sent
  # this link (with the pack's SHA-1, so their client still checks the download)
  # and you upload output/resource_pack.zip there after every rebuild. {sha1} in
  # the link becomes the pack's hash, for hosts that cache by URL. Empty: unused.
  # With this set you can turn the built-in server off (enabled: false).
  external-url: ""

# ---------------------------------------------------------------------------
#  Automatic upload to a web storage API
# ---------------------------------------------------------------------------
#  After every rebuild the zip is sent to 'url' as a multipart/form-data POST -
#  the request an HTML upload form makes - and players are sent the download
#  link found in the answer, with the new pack's SHA-1. An unchanged pack is
#  not uploaded again (data/upload.json remembers the link). The upload runs
#  off the main thread; until it is done players keep the pack they have.
#  This overrides http.external-url. If an upload fails, players are sent the
#  built-in server's link when it is running, or keep their previous pack.
# ---------------------------------------------------------------------------
upload:
  enabled: false
  # The service's upload endpoint.
  url: "https://storage.example.com/api/upload"
  # POST, or PUT for the services that want it.
  method: POST
  # The form field the zip goes in, and the file name sent with it.
  file-field: "file"
  file-name: "resource_pack.zip"
  # More form fields, sent before the file: a folder, an expiry, a key...
  fields: {}
  #   folder: "minecraft"
  # Request headers - usually the service's API key.
  headers: {}
  #   Authorization: "Bearer YOUR-TOKEN"
  # Where the link is in the answer. A JSON answer: its path, as in data.url or
  # files[0].url. Any other answer: a regular expression in url-pattern whose
  # first group is the link. Neither set: the whole answer is the link.
  response:
    url-path: "data.url"
    url-pattern: ""
  # The link players are sent. {value} is what was found above, {sha1} the
  # pack's hash; for a service that answers with a file id, write the link
  # around it, e.g. "https://cdn.example.com/files/{value}".
  download-url: "{value}"
  # Per request, in seconds (5-600).
  timeout-seconds: 60
  # Tries again this many times after a network error, timeout or 5xx answer,
  # pausing 2, 4, 8... seconds. A refusal (wrong key, file too large) is not retried.
  retries: 2
  # Download the link back and compare its SHA-1 before sending it to anyone.
  # Catches services that recompress or truncate files, which players' clients
  # would reject. Costs one download per changed pack.
  verify: true

delivery:
  # Send the pack to every player as they join.
  send-on-join: true
  # Players who decline a required pack are disconnected by their own client.
  required: true
  # Shown on the download prompt. MiniMessage. Empty keeps the client's own text.
  prompt: "<yellow>This server uses custom items.</yellow> <gray>Accept the resource pack to see them."
  # With AuthMe, send the pack once the player has logged in rather than on joining,
  # so the download screen does not cover the login prompt. Without AuthMe this
  # does nothing.
  after-login: true

crops:
  # How often, in seconds, the growth scheduler adds time to every crop in a loaded
  # chunk. It runs off the main thread; only a crop moving to its next stage costs
  # the server tick anything. Growth speed itself is each crop's stage-seconds.
  tick-seconds: 5

guns:
  # Threads shots are traced on (ArkContent-Guns-n). The world is copied on the
  # server thread; walls, hitboxes, heads and falloff are worked out on these.
  threads: 1
  # Shown on the action bar. MiniMessage.
  messages:
    reloading: "<yellow>Reloading..."
    no-ammo: "<red>Out of ammo"

liquids:
  # How many liquid blocks may appear or drain in one tick, across the server.
  # A liquid is seen to run at its own tick-rate; this only caps a burst.
  changes-per-tick: 64
  # How often, in ticks, players are checked for standing in a liquid. Each
  # liquid then hurts at its own contact.interval-ticks.
  contact-ticks: 10
  # Chunks around a source its flow is worked out over (1-4), on the
  # ArkContent-Fluids thread. A liquid stops at the edge of this.
  chunk-reach: 1

huds:
  # How often, in ticks, HUDs with action-bar: true are sent again.
  action-bar-ticks: 20
  # How often, in seconds, changed HUD values (thirst...) are written to SQLite.
  # They are written as a player leaves too.
  save-seconds: 30
  # 3.1: with BetterHud and PlaceholderAPI installed, BetterHud draws the bars
  # that would go on the action bar, as HUDs of its own (written to its folder:
  # huds/arkcontent.yml and the rest), so they sit with the rest of its HUD.
  # false keeps them on the action bar; 'betterhud:' on one HUD decides for it.
  betterhud: true

# ---------------------------------------------------------------------------
#  Font images: menus written for ItemsAdder
# ---------------------------------------------------------------------------
#  ItemsAdder's text for pictures drawn as characters - a menu's background, an
#  icon in a lore line - works without it:
#    :offset_-20:  %img_offset_-20%    20 pixels back (positive: forward)
#    :skills_menu_book:  %img_skills_menu_book%  :namespace:name:   a font image
#  Names come from font_images: in the contents (what /arkcontent import keeps
#  from ItemsAdder's configs) and, for packs merged without their configs, from
#  the picture's file name. /arkcontent info says how many there are.
# ---------------------------------------------------------------------------
font-images:
  # Rewrite them in menu titles as a menu opens, whichever plugin opens it.
  titles: true
  # Answer %img_<name>% and %img_offset_<n>% through PlaceholderAPI - not when
  # ItemsAdder is installed, whose placeholders they are.
  placeholders: true

# ---------------------------------------------------------------------------
#  Menus: /arkcontent menu and /arkcontent shop
# ---------------------------------------------------------------------------
menus:
  # The contents/ folders as the first level - one per content pack, as
  # dragones_epicos/ or arkespadas/ - each opening onto its items and its own
  # sub-folders. false: one flat list, as before 1.9.
  folders: true
  # Draw the menu over a picture of its own: a font image, by name, behind
  # the whole chest - a custom GUI. The plugin ships a book with a spiral
  # binding (arkcontent:content_browser), wider and taller than the chest and
  # covering the player's slots too. Any font image of your packs works, e.g.
  # one of ItemsAdder's GUIs.
  textured: true
  background: "arkcontent:content_browser"
  # For a picture other than the plugin's own: how wide it is drawn, up to
  # its last column with a pixel in it, and where its left edge is from the
  # inventory's (negative: further left). The plugin's book ignores both.
  background-width: 176
  background-x: 0
  # The title - "Categories", or the folder open - over the picture: its
  # colour, and centred on the picture or "left" where vanilla starts it.
  title-colour: "#E6CB98"
  title-align: centre
  # Which of the 45 upper slots show entries, in order. The book's margins
  # lie outside the slots, so all of them; a picture whose frame covers the
  # border slots can leave them blank, e.g. "10-16, 19-25, 28-34".
  content-slots: "0-44"

# ---------------------------------------------------------------------------
#  Furniture
# ---------------------------------------------------------------------------
furniture:
  # Two chests of furniture with a double: section, placed side by side,
  # join into a double chest. Its lid starts to open, or to shut, this long
  # after the click: on the first server tick at or after it. Ticks are 50 ms
  # apart, so with 63 the lid moves 63 to 113 ms after the click; 0 moves it
  # at once.
  double-chest-animation-delay-ms: 63

# ---------------------------------------------------------------------------
#  Quest boards: furniture with interactable: medieval_bulletin_board
# ---------------------------------------------------------------------------
quest-boards:
  # The picture behind the notices: parchment, shipped with the plugin.
  background: "arkcontent:quest_board"
  background-width: 176
  # Notices a player can have under way at once.
  max-active: 5
  # Kills and broken blocks are counted in memory and written this often -
  # and when a player leaves or completes a notice.
  save-seconds: 10

# ---------------------------------------------------------------------------
#  Sanity checker
# ---------------------------------------------------------------------------
#  Rollbacks, /fill, world editors and crashes can change the world behind the
#  plugin's back. Every interval, the loaded chunks are audited: a furniture
#  display whose block is gone is removed, and a stored custom block, furniture
#  or liquid source whose block is no longer it has its row purged (one SQLite
#  transaction, only if the row is unchanged). Something is acted on only when
#  two audits in a row find it the same way, so a rollback in progress is left
#  to finish. Driven from the ArkContent-DB thread; the world is read on the
#  server thread a slice per tick, and never a chunk loaded for it. Quiet: one
#  console line when something was cleaned, nothing otherwise.
# ---------------------------------------------------------------------------
sanity:
  enabled: true
  interval-seconds: 120
  # Server-thread time an audit may take per tick; a large world spreads over
  # more ticks.
  max-millis-per-tick: 1.0
  # 5.0: a custom block or a liquid source whose block was found turned to air
  # (a rollback, /fill, a crash) - or its note block / tripwire put in another
  # state - is put back, exactly as it was, instead of having its row purged.
  # Anything else found there (stone, a chest...) is left, and the row purged.
  # WorldEdit is not fought: what it removes, the plugin forgets at once.
  rebuild-missing-blocks: true
  # Something that keeps taking the same block away means it - a plugin that
  # regenerates an area, say: after this many times in 24 hours, the block is
  # let go and its row purged. 0: never put back.
  max-rebuilds-per-block-per-day: 3

# 5.0: ore generation. A custom block with a 'block: generation:' section (see
# contents/demo/blocks.yml) is laid into new chunks as they are generated - in
# the worlds, biomes and heights it names - by the server's own generation
# threads: no world generator plugin needed, and nothing on the main thread.
# Chunks generated before are left as they are.
generation:
  enabled: true

# ---------------------------------------------------------------------------
#  Bedrock players (3.0), through Geyser - on this server or (3.3) on a proxy
# ---------------------------------------------------------------------------
#  Every rebuild also converts the content for Bedrock, on the ArkContent-Worker
#  thread: an icon for each item, each custom block and liquid as a Bedrock
#  block, each piece of furniture cut into the block cells it covers, and the
#  emojis as glyph sheets, all in one .mcpack (output/bedrock/). Geyser draws
#  no item displays, so Bedrock players are shown furniture as blocks of its
#  own, sent to them alone: Java players and the world keep the barriers.
#  Geyser takes custom items and blocks only as it starts: content added later
#  reaches Bedrock players after Geyser restarts. The note block states
#  furniture is drawn with ("carriers") are kept in data/bedrock_carriers.json.
#
#  With Geyser-Spigot on this server, Geyser is handed everything through its
#  API as it starts; nothing needs configuring there.
#
#  With Geyser on a proxy (Velocity, BungeeCord) and Floodgate on this server
#  (3.3): every rebuild writes output/bedrock/geyser-extension/ - the content
#  and the .mcpack. On the proxy, put this same jar in Geyser's extensions/
#  folder (plugins/Geyser-Velocity/extensions/) and those two files in
#  extensions/arkcontent/, then restart the proxy. Do it again after content
#  changes. Floodgate here says who plays on Bedrock.
#    auto  - on when Geyser-Spigot or Floodgate is installed here (default)
#    true  - always on
#    proxy - on, as for a Geyser on a proxy even if Geyser-Spigot is here
#    false - never
#  With it on, every item with a model also gets a custom_model_data number
#  (pack.custom-model-data), which Geyser 2.8 tells custom items apart by.
# ---------------------------------------------------------------------------
bedrock:
  enabled: auto
  # 3.3: if the proxy's Geyser folder is reachable from here (the same machine
  # or a shared disk), the files are written straight into it as well, e.g.
  # /srv/proxy/plugins/Geyser-Velocity/extensions/arkcontent
  geyser-folder: ''
  # 3.3: furniture Bedrock players are not shown, by id or namespace:*. There
  # are only so many note block states for carriers (one per block of a piece
  # and per quarter turn: a 6x6 well takes over 400), and when they run out
  # the biggest pieces are left out. Listing some here leaves those out instead.
  skip-furniture: []

# ---------------------------------------------------------------------------
#  Recipes (4.0)
# ---------------------------------------------------------------------------
#  The recipes: of the content files are the server's own: crafting table,
#  furnace, blast furnace, smoker, campfire, stonecutter and smithing table,
#  each in every player's recipe book (see contents/demo/recipes.yml).
#
#  A custom item is made of a vanilla material - a ruby of paper - and to the
#  game's recipes it would be that material: a book from rubies, a netherite
#  sword from a custom diamond one. With this on, a vanilla recipe gives
#  nothing while a custom item is among its ingredients (crafting table,
#  crafter, smithing table), and furnaces and campfires do not cook one by a
#  vanilla recipe. The plugin's own recipes take custom items only where they
#  name them. Other plugins' recipes are left alone.
# ---------------------------------------------------------------------------
recipes:
  protect-custom-items: true
