name: ArkcronistContent
version: '${version}'
main: com.arkcronist.content.bukkit.ArkContentPlugin
description: Custom items from YAML, drawn by a resource pack the plugin compiles, zips, hashes and serves itself.
author: Arkcronist
website: https://github.com/NicolasIz/ApocCommunityPatch
# Compiled against the 1.21.8 API. (1.21.4 introduced the item_model component and the
# assets/<namespace>/items/ folder this plugin is built on; nothing older can draw these items.)
api-version: '1.21.8'
folia-supported: false

# Optional integrations. join-classpath lets the hooks see these plugins' classes; none is
# required, and without one its hook simply stays off.
dependencies:
  server:
    # Loads before this plugin. Loading after it - to be listening as MythicMobs reads its mobs -
    # makes a loop with AuraSkills and BetonQuest, which load after MythicMobs and before this
    # plugin, and Paper refuses to start. So MythicMobs is reloaded once instead, if its files use
    # arkcontent drops or equipment (see MythicMobsHook).
    MythicMobs:
      load: BEFORE
      required: false
      join-classpath: true
    # HMCCosmetics takes items from other plugins through HibiscusCommons: the hook is registered
    # with the library (loaded first) before HMCCosmetics (loaded after) reads its cosmetics.
    HibiscusCommons:
      load: BEFORE
      required: false
      join-classpath: true
    HMCCosmetics:
      load: AFTER
      required: false
      join-classpath: true
    # Jobs plugins: money and job experience for custom blocks and crops.
    Jobs:
      load: BEFORE
      required: false
      join-classpath: true
    # Loads after this plugin, like the other NightExpress plugins below: their item rewards are
    # read as they enable, through nightcore's item adapters, and this plugin's has to be there.
    ExcellentJobs:
      load: AFTER
      required: false
      join-classpath: true
    nightcore:
      load: BEFORE
      required: false
      join-classpath: true
    # Auctions: listed and bought items keep their look.
    zAuctionHouseV4:
      load: BEFORE
      required: false
      join-classpath: true
    # 1.6: other plugins' shared item registries. Each library loads first, so the registry is there
    # to add to; the plugins built on it load after, so they find this plugin's items when they read
    # their configs.
    eco:
      load: BEFORE
      required: false
      join-classpath: true
    EcoItems:
      load: AFTER
      required: false
      join-classpath: false
    EcoArmor:
      load: AFTER
      required: false
      join-classpath: false
    EcoEnchants:
      load: AFTER
      required: false
      join-classpath: false
    EcoMobs:
      load: AFTER
      required: false
      join-classpath: false
    EcoBosses:
      load: AFTER
      required: false
      join-classpath: false
    Reforges:
      load: AFTER
      required: false
      join-classpath: false
    StatTrackers:
      load: AFTER
      required: false
      join-classpath: false
    Talismans:
      load: AFTER
      required: false
      join-classpath: false
    EcoSkills:
      load: AFTER
      required: false
      join-classpath: false
    EcoShop:
      load: AFTER
      required: false
      join-classpath: false
    EcoJobs:
      load: AFTER
      required: false
      join-classpath: false
    EcoPets:
      load: AFTER
      required: false
      join-classpath: false
    EcoCrates:
      load: AFTER
      required: false
      join-classpath: false
    Actions:
      load: AFTER
      required: false
      join-classpath: false
    ExcellentCrates:
      load: AFTER
      required: false
      join-classpath: false
    ExcellentShop:
      load: AFTER
      required: false
      join-classpath: false
    ExcellentEnchants:
      load: AFTER
      required: false
      join-classpath: false
    Mimic:
      load: BEFORE
      required: false
      join-classpath: true
    ItemBridge:
      load: BEFORE
      required: false
      join-classpath: true
    # Menus, quests and logins: their own hooks are added to as this plugin enables.
    DeluxeMenus:
      load: BEFORE
      required: false
      join-classpath: true
    BetonQuest:
      load: BEFORE
      required: false
      join-classpath: true
    AuthMe:
      load: BEFORE
      required: false
      join-classpath: true
    ModelEngine:
      load: BEFORE
      required: false
      join-classpath: true
    # Loads after this plugin for the same reason: its first pack is generated as it enables.
    MythicArmor:
      load: AFTER
      required: false
      join-classpath: true
    # Placeholders for TAB, DeluxeMenus and others: registered as this plugin enables.
    PlaceholderAPI:
      load: BEFORE
      required: false
      join-classpath: true
    # Asks for item providers as it enables, so this plugin has to be listening by then.
    ShopGUIPlus:
      load: AFTER
      required: false
      join-classpath: true
    # A world generator, enabled early; the block provider is registered with it at once.
    Iris:
      load: BEFORE
      required: false
      join-classpath: true
    # Loads first: its item stat has to be registered while plugins are still loading, before
    # MMOItems reads its item configs. MythicLib is the library MMOItems' API is written against.
    MMOItems:
      load: BEFORE
      required: false
      join-classpath: true
    MythicLib:
      load: BEFORE
      required: false
      join-classpath: true
    # Protection plugins, asked before this plugin changes a block on its own. WorldGuard's API is
    # written in WorldEdit's classes, so WorldEdit (or FastAsyncWorldEdit) is joined too.
    WorldGuard:
      load: BEFORE
      required: false
      join-classpath: true
    WorldEdit:
      load: BEFORE
      required: false
      join-classpath: true
    GriefPrevention:
      load: BEFORE
      required: false
      join-classpath: true
    # Skills plugins: experience for custom blocks and crops. AuraSkills also takes the items, for
    # its menus, as it enables - it loads first, and the items are registered before its first tick.
    AuraSkills:
      load: BEFORE
      required: false
      join-classpath: true
    mcMMO:
      load: BEFORE
      required: false
      join-classpath: true
    SkillAPI:
      load: BEFORE
      required: false
      join-classpath: true
    ProSkillAPI:
      load: BEFORE
      required: false
      join-classpath: true
    Fabled:
      load: BEFORE
      required: false
      join-classpath: true
    # Economy for /arkcontent shop.
    Vault:
      load: BEFORE
      required: false
      join-classpath: true
    Citizens:
      load: BEFORE
      required: false
      join-classpath: true
    DecentHolograms:
      load: BEFORE
      required: false
      join-classpath: true
    # Asks for item providers as it loads its shops, so this plugin has to be listening by then.
    EconomyShopGUI-Premium:
      load: AFTER
      required: false
      join-classpath: true
    # ExecutableBlocks' API lives in SCore; both are joined.
    SCore:
      load: BEFORE
      required: false
      join-classpath: true
    ExecutableBlocks:
      load: BEFORE
      required: false
      join-classpath: true

# Commands are not declared here: a Paper plugin registers them through Brigadier at runtime
# (see ArkContentPlugin#onEnable). Permissions still are.
permissions:
  arkcontent.give:
    description: Use /customgive, and take items out of the content browser.
    default: op
  arkcontent.admin:
    description: Use /arkcontent reload, info, import, editor, animate, npc, hud and liquids; hear about web server problems on joining.
    default: op
  arkcontent.emojis:
    description: Use /emojis to list the chat emojis. Using an emoji needs nothing, unless it names its own permission.
    default: true
  arkcontent.menu:
    description: Open the content browser (/arkcontent menu). Taking items out of it needs arkcontent.give.
    default: op
  arkcontent.shop:
    description: Buy custom items that have a price (/arkcontent shop). Needs Vault and an economy plugin.
    default: true
