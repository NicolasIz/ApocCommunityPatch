name: ArkcronistContent
version: '${version}'
main: com.arkcronist.content.bukkit.ArkContentPlugin
description: Custom items from YAML, drawn by a resource pack the plugin compiles, zips, hashes and serves itself.
author: Arkcronist
website: https://github.com/NicolasIz/ApocCommunityPatch
# 1.21.4 introduced the item_model component and the assets/<namespace>/items/ folder this plugin
# is built on; nothing older can draw these items.
api-version: '1.21.4'
folia-supported: false

# Commands are not declared here: a Paper plugin registers them through Brigadier at runtime
# (see ArkContentPlugin#onEnable). Permissions still are.
permissions:
  arkcontent.give:
    description: Use /customgive.
    default: op
  arkcontent.admin:
    description: Use /arkcontent reload and /arkcontent info.
    default: op
