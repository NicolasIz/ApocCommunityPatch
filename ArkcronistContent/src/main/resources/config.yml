# ---------------------------------------------------------------------------
#  ArkcronistContent
# ---------------------------------------------------------------------------
#  Items are defined in plugins/ArkcronistContent/contents/ - one folder per
#  content pack, any number of .yml files inside it. See contents/demo/ for a
#  worked example (written the first time the plugin starts).
#
#  /arkcontent reload rebuilds items and the resource pack from contents/.
#  Changes to THIS file need a restart.
# ---------------------------------------------------------------------------

# Write the demo content pack into contents/ when that folder does not exist yet.
# On an upgrade, also add the examples the new version brings (1.4.0: the Blood
# Ruby Knight armour, armor.yml) to contents/demo/ - never over a file that is
# there, never into contents/demo/ if it was deleted, and never twice.
extract-examples: true

pack:
  # Shown in the client's resource pack list. MiniMessage.
  description: "<gold>Arkcronist</gold> <gray>custom content"
  # Resource pack formats the pack declares it supports. 46 is 1.21.4, the first
  # release that can draw these items at all; 99 leaves room for later clients.
  # 'format' must lie between the two.
  format: 46
  min-format: 46
  max-format: 99

http:
  # The built-in web server that hands the pack to players. With it off, the pack
  # is still built (plugins/ArkcronistContent/output/resource_pack.zip) for you to
  # host elsewhere, and nothing is sent to players.
  enabled: true
  # Interface to listen on. 0.0.0.0 means all of them.
  bind-address: "0.0.0.0"
  # Must be reachable from players' machines: open or forward it like the game port.
  port: 8163
  # The address players' clients download from - your public IP or domain, NOT
  # 0.0.0.0. Empty means server-ip from server.properties; if that is empty too,
  # 127.0.0.1, which only works for a client on this same machine.
  public-address: ""
  # Downloads served at the same time. More players than this simply queue.
  threads: 4
  # Host the pack yourself instead: a CDN, a web host, a bucket. Players are sent
  # this link (with the pack's SHA-1, so their client still checks the download)
  # and you upload output/resource_pack.zip there after every rebuild. {sha1} in
  # the link becomes the pack's hash, for hosts that cache by URL. Empty: unused.
  # With this set you can turn the built-in server off (enabled: false).
  external-url: ""

# ---------------------------------------------------------------------------
#  Automatic upload to a web storage API
# ---------------------------------------------------------------------------
#  After every rebuild the zip is sent to 'url' as a multipart/form-data POST -
#  the request an HTML upload form makes - and players are sent the download
#  link found in the answer, with the new pack's SHA-1. An unchanged pack is
#  not uploaded again (data/upload.json remembers the link). The upload runs
#  off the main thread; until it is done players keep the pack they have.
#  This overrides http.external-url. If an upload fails, players are sent the
#  built-in server's link when it is running, or keep their previous pack.
# ---------------------------------------------------------------------------
upload:
  enabled: false
  # The service's upload endpoint.
  url: "https://storage.example.com/api/upload"
  # POST, or PUT for the services that want it.
  method: POST
  # The form field the zip goes in, and the file name sent with it.
  file-field: "file"
  file-name: "resource_pack.zip"
  # More form fields, sent before the file: a folder, an expiry, a key...
  fields: {}
  #   folder: "minecraft"
  # Request headers - usually the service's API key.
  headers: {}
  #   Authorization: "Bearer YOUR-TOKEN"
  # Where the link is in the answer. A JSON answer: its path, as in data.url or
  # files[0].url. Any other answer: a regular expression in url-pattern whose
  # first group is the link. Neither set: the whole answer is the link.
  response:
    url-path: "data.url"
    url-pattern: ""
  # The link players are sent. {value} is what was found above, {sha1} the
  # pack's hash; for a service that answers with a file id, write the link
  # around it, e.g. "https://cdn.example.com/files/{value}".
  download-url: "{value}"
  # Per request, in seconds (5-600).
  timeout-seconds: 60
  # Tries again this many times after a network error, timeout or 5xx answer,
  # pausing 2, 4, 8... seconds. A refusal (wrong key, file too large) is not retried.
  retries: 2
  # Download the link back and compare its SHA-1 before sending it to anyone.
  # Catches services that recompress or truncate files, which players' clients
  # would reject. Costs one download per changed pack.
  verify: true

delivery:
  # Send the pack to every player as they join.
  send-on-join: true
  # Players who decline a required pack are disconnected by their own client.
  required: true
  # Shown on the download prompt. MiniMessage. Empty keeps the client's own text.
  prompt: "<yellow>This server uses custom items.</yellow> <gray>Accept the resource pack to see them."

crops:
  # How often, in seconds, the growth scheduler adds time to every crop in a loaded
  # chunk. It runs off the main thread; only a crop moving to its next stage costs
  # the server tick anything. Growth speed itself is each crop's stage-seconds.
  tick-seconds: 5
