  # The guillotine of the square: a frame two blocks wide and three high. The
  # left block (as you face it) holds the stocks: a right click there kneels
  # you in them. The right one holds the lever: a right click there drops the
  # blade, on the first server tick at least delay-ms after the click, and it
  # lands impact-ms later on whoever kneels in the stocks - nobody, and it
  # falls harmlessly. The blow counts as the lever-puller's attack, so where a
  # protection plugin denies PvP it does nothing; respect-pvp: false lets it
  # through. victim: user drops it on whoever pulls the lever instead.
  guillotina_plaza:
    type: custom_furniture
    display-name: "<#c8a165>Guillotina de la plaza"
    lore:
      - "<gray>Clic en el cepo: arrodíllate."
      - "<gray>Clic en la palanca: deja caer la hoja."
    resource:
      model: furniture/guillotina_plaza_icon
    furniture:
      support: BARRIER
      size: {width: 2, height: 3}
      animated-model: furniture/guillotina_plaza
      interactable: guillotine
      guillotine:
        drop: drop_blade
        reset: reset_blade
        delay-ms: 63
        impact-ms: 250
        reset-after: 3
        lever: {across: 1, up: 0}
        kneel-height: 0.2
        victim: occupant
        respect-pvp: true
        impact-sound: minecraft:block.anvil.land
        impact-particles:
          - {particle: crit, offset: [0, 1.4, 0], count: 18, spread: 0.3, speed: 0.4}
          - {particle: electric_spark, offset: [0, 1.4, 0], count: 10, spread: 0.25, speed: 0.2}
          - {particle: enchanted_hit, offset: [0, 1.3, 0], count: 8, spread: 0.3, speed: 0.2}
        commands:
          - 'minecraft:tellraw @a ["",{"text":"[Plaza] ","color":"dark_red"},{"text":"La guillotina ha caído sobre %player%.","color":"gray"}]'
