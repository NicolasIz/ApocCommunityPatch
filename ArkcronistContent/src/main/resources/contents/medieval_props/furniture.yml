# ---------------------------------------------------------------------------
#  Medieval props (1.9.5): 60 pieces for a spawn's square
# ---------------------------------------------------------------------------
#  Give one:   /customgive <player> medieval_props:<id>
#  All 60, laid out in rows in front of you:   /arkcontent showcase medieval_props
#
#  What a right click does:
#    seat     - sit down (sneak to get up)
#    effect   - particles on a loop, seen by players within 'range' blocks,
#               and on-click: potion effects, a sound, a line of text
#    command  - runs commands: from the console, or 'as: player'. Filled in:
#               %player% %uuid% %world% %dimension% %x% %y% %z%
#               The signs only greet the player; replace 'run' with your own
#               commands (a menu, a warp, a shop): dm open banco %player% ...
#    storage  - an inventory kept in the plugin's database
#    guillotine - kneel in the stocks with a right click on the frame; a right
#               click on the lever drops the blade on whoever kneels there
#
#  Every piece is a Java model under models/furniture/ with its own texture,
#  painted for it, under textures/furniture/; the guillotine is a Blockbench
#  model with the animations drop_blade and reset_blade.
# ---------------------------------------------------------------------------

